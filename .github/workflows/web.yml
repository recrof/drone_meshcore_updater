name: Web client

# The web client is plain ES modules — no build step for development. This
# workflow runs the tests, publishes web/ to GitHub Pages, and bundles a single
# self-contained updater.html for people who'd rather host one file.
#
# Pages must be enabled for the repo with Source = "GitHub Actions"
# (Settings -> Pages). Without it, deploy-pages fails with a bare 404:
# "Failed to create deployment ... Ensure GitHub Pages has been enabled".

# Deploys are tied to releases; pushes only run the tests.
#
# Both used to deploy, so committing and then publishing a release fired two
# runs seconds apart that built the same site. `concurrency: pages` collapsed
# them, but the second one was still redundant work and made the run list hard
# to read. Tests still guard every push to main — losing that to remove a
# duplicate deploy would be a bad trade.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  # Deploy after the firmware build finishes, not when the release is
  # published. Two reasons, both learned the hard way:
  #
  #  1. **Ordering.** Publishing fires this and build.yml at the same instant,
  #     so the staging step went looking for release assets that were still
  #     minutes from existing.
  #  2. **The github-pages environment rejects tag refs.** Its default
  #     protection rule allows only the default branch, and a release event's
  #     ref is refs/tags/vX — "Tag v1.1 is not allowed to deploy to
  #     github-pages due to environment protection rules". A `workflow_run`
  #     event runs in the *default branch* context, which the rule permits.
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # workflow_run and workflow_dispatch both give a branch ref, so plain
      # checkout is correct: the app always tracks the default branch, and
      # only the *firmware asset* comes from the release.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Before any test step, because several suites render a component in
      # jsdom and every one of them *skips silently* without it. That is how
      # scanner.test.mjs's render check — the only thing in the suite that can
      # see a broken Vue template, since a template error is a blank panel and
      # not a syntax error — reported "ok" in CI while never running: the
      # install used to live in the Render tests step, twenty steps later.
      - name: Install jsdom
        run: npm install --no-save jsdom

      - name: Schema tests (no dependencies)
        run: node web/test/config-file.test.mjs

      - name: PWA manifest / precache tests
        run: node web/test/pwa.test.mjs

      # The half of the USB flasher that can be tested without a probe. The
      # rest (CMSIS-DAP, SWD, RRAM) needs hardware.
      - name: Intel HEX tests
        run: node web/test/intel-hex.test.mjs

      - name: CMSIS-DAP / SWD encoding tests
        run: node web/test/cmsis-dap.test.mjs

      # Both probe flash algorithms, against models of the two flash
      # controllers. The RRAM model reproduces Trap 1 (a partial trailing line
      # left in the write buffer) and the MSC model refuses a write to a page
      # that was not erased, so an algorithm that looks right and is not fails
      # here rather than on a board that is not always plugged in.
      - name: Probe flash algorithm tests
        run: node web/test/swd-flash.test.mjs

      # Cross-checks the fsx_mgmt command IDs against the client's copy. A
      # renumbered command is silent both ways: the client sends one command
      # and the device runs another, or waits out a 15 s timeout.
      - name: fsx_mgmt command table tests
        run: node web/test/fsx-mgmt.test.mjs

      # The link teardown and the stale-link sweep: structural checks on
      # firmware node cannot run, but both defects they encode are absences —
      # a missing disconnect and a missing role check — and an absence is what
      # a reviewer's eye slides over.
      - name: BLE link teardown tests
        run: node web/test/ble-link.test.mjs

      # The signal bands and the sentence that explains them, the SCAN wire
      # format against the encoder that produces it, and the two halves that
      # stop a survey outliving the client that asked for it.
      - name: BLE scanner tests
        run: node web/test/scanner.test.mjs

      # Cross-checks the log file naming against updater/prj.conf.
      - name: Log file tests
        run: node web/test/log-file.test.mjs

      # Holds common.dtsi's `cache-size` against prj.conf's
      # CONFIG_FS_LITTLEFS_CACHE_SIZE. They are different settings — one sizes
      # each per-file cache, the other sizes the heap they come out of — and
      # raising only the first produces a board that boots, mounts, and then
      # fails every fs_open() with -ENOMEM, reported to the user as
      # "config.txt not present". Also enforces littlefs's own divisibility
      # rules, which otherwise fail at mount time on hardware.
      - name: LittleFS cache tests
        run: node web/test/littlefs-cache.test.mjs

      # Locks out the way this device stopped being discoverable: restarting a
      # connectable advertiser needs HCI LE Set Random Address, which is
      # Command Disallowed while scanning, so a client disconnecting with the
      # scanner open left the board off the air permanently. Structural — the
      # firmware built, booted and flashed correctly with the bug in it.
      - name: Advertising restart tests
        run: node web/test/adv-restart.test.mjs

      # Cross-checks the live DFU status layout, enums and service UUIDs
      # against updater/src/dfu_status.[ch]. A renumbered state parses fine
      # and reports the wrong step, so nothing at run time would catch it.
      - name: DFU status wire-format tests
        run: node web/test/dfu-status.test.mjs

      # The two USB flashers that reach a board over a serial port. Neither
      # target can be watched while it is being written — the ESP32-S3 has no
      # console at all in download mode — so the framing, checksums, block
      # sizes and sequence numbers are driven here against device models that
      # refuse what the real bootloaders refuse.
      - name: Serial framing tests
        run: node web/test/serial.test.mjs

      - name: MD5 tests
        run: node web/test/md5.test.mjs

      - name: ESP32-S3 ROM loader tests
        run: node web/test/esptool.test.mjs

      - name: Nordic serial DFU tests
        run: node web/test/nordic-dfu-serial.test.mjs

      # Firmware-file inspection: is this a legacy DFU package or an ESP32
      # image, is it intact, and can the device in front of the user flash it.
      # Every fixture is built in the test, and the ZIP writer there is
      # deliberately not the ZIP reader under test.
      - name: Firmware image inspection tests
        run: node web/test/firmware-image.test.mjs

      # The inspector's wire contract: enum values, the rejected-extension
      # list and the CRC variants, against the C that produces them.
      - name: Firmware inspect contract tests
        run: node web/test/dfu-inspect.test.mjs

      # Catches mistyped this.x() in the hardware-driving modules, which jsdom
      # cannot execute and whose error paths only run against a real device.
      - name: Self-call check
        run: node web/test/self-calls.test.mjs

      # Header layout + DFU zip, cross-checked against the real build when one
      # is present.
      - name: MCUboot image tests
        run: node web/test/mcuboot-image.test.mjs

      # The staged firmware index: stage-firmware.mjs's entries against
      # firmware-manifest.js's reader and every consuming component, plus the
      # three hand-written board tables — USB method, display name, and the
      # button dance each flasher needs — against the boards this repo can
      # actually build. Those are the board facts no build output carries.
      - name: Firmware staging tests
        run: node web/test/stage-firmware.test.mjs

      - name: Bundle single-file build
        run: node web/tools/build-single.mjs web/dist/updater.html

      # Re-run now that dist/ exists: the single-file build has to have had
      # its manifest and icon links stripped, or it registers a service
      # worker for an sw.js that isn't next to it.
      - name: PWA single-file checks
        run: node web/test/pwa.test.mjs

      - name: Render tests
        run: |
          node web/test/render.test.mjs web/dist/updater.html
          node web/test/flash-dialog.test.mjs web/dist/updater.html
          node web/test/dfu-banner.test.mjs

      - name: Upload single-file build
        uses: actions/upload-artifact@v7
        with:
          name: updater-single-file
          path: web/dist/updater.html

      # Only stage/upload the Pages artifact when we are actually going to
      # deploy. On a push or a PR it would be built and thrown away.
      - name: Stage site
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p _site
          cp -r web/index.html web/css web/js web/vendor web/icons _site/
          # sw.js must sit at the site root: a worker's scope cannot be
          # broader than the directory it is served from.
          cp web/sw.js web/manifest.webmanifest _site/
          cp web/dist/updater.html _site/updater.html

      # Publish every board's artifacts next to the app, so "Flash newest" and
      # "Update over Bluetooth" are one click and need no GitHub round trip
      # from the browser. One subdirectory and one manifest entry per board;
      # the client picks the entry matching the device in front of it.
      #
      # Deliberately never fails the build. There is nothing to publish until
      # a release exists, and build.yml creates releases as DRAFTS — a draft's
      # assets are not downloadable, so the site correctly shows "no published
      # build available" until someone publishes one.
      - name: Stage newest firmware
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty now that the deploy follows the build rather than the
          # release event; the "newest published release" query below is the
          # only path. Kept as a hook for a future direct-release trigger.
          RELEASE_TAG: ""
        run: |
          set -u
          mkdir -p _site/firmware assets

          TAG="${RELEASE_TAG:-}"
          if [ -z "${TAG}" ]; then
            TAG=$(gh release list --limit 10 --json tagName,isDraft \
                    --jq '[.[] | select(.isDraft | not)] | .[0].tagName // empty' 2>/dev/null || true)
          fi
          if [ -z "${TAG}" ]; then
            echo "::notice::no published release yet — 'Flash newest' will be unavailable"
            exit 0
          fi
          echo "staging firmware from ${TAG}"

          # Which boards did this release publish?
          #
          # build.yml writes one <base>-board.txt per board, holding the full
          # Zephyr board target. That file IS the list — no board names here,
          # so adding a board to the build matrix needs no change in this
          # workflow. It also carries the variant ("xiao_ble/nrf52840"), which
          # an asset filename cannot, and which the client needs because it
          # compares against what the device reports over os_mgmt.
          #
          # Retry briefly. With build.yml's default (draft: true) the assets
          # are always present by the time a human can publish, so this never
          # loops. It matters if anyone sets draft: false: the release is then
          # created already-published, which fires this workflow *before*
          # softprops has finished uploading, and the assets appear seconds
          # later.
          ok=""
          for attempt in 1 2 3 4 5; do
            if gh release download "${TAG}" --pattern '*-board.txt' --dir assets --clobber; then
              ok=yes
              break
            fi
            echo "attempt ${attempt}: no *-board.txt on ${TAG} yet, waiting…"
            sleep 10
          done
          if [ -z "${ok}" ]; then
            echo "::warning::release ${TAG} published no board manifests — firmware unavailable"
            exit 0
          fi

          # Everything else in one go; each board's files share its base name.
          gh release download "${TAG}" --pattern '*-merged.hex' --dir assets --clobber || true
          gh release download "${TAG}" --pattern '*-merged.uf2' --dir assets --clobber || true
          gh release download "${TAG}" --pattern '*-dfu.zip'    --dir assets --clobber || true
          # A board with no single-file image publishes its pieces plus a
          # parts.txt saying where each one goes. Both patterns are harmless
          # for boards that publish neither.
          gh release download "${TAG}" --pattern '*-parts.txt'  --dir assets --clobber || true
          gh release download "${TAG}" --pattern '*.bin'        --dir assets --clobber || true
          ls -la assets/

          # Same script a developer runs locally, so the manifest schema has
          # exactly one producer and cannot drift from its reader. Each call
          # rewrites only its own board's entry, so the boards accumulate into
          # one index and a board that failed to build simply is not in it.
          staged=0
          for marker in assets/*-board.txt; do
            [ -e "${marker}" ] || continue
            base="${marker%-board.txt}"
            board="$(tr -d '[:space:]' < "${marker}")"
            [ -n "${board}" ] || { echo "::warning::${marker} is empty — skipping"; continue; }
            echo "--- staging ${board}"

            # A board with no single-file image ships <base>-parts.txt, one
            # `name@offset` per line, written by the build from the stager's
            # own layout. Nothing here knows an offset; this loop only moves
            # files and passes the numbers through.
            #
            # The copy is not busywork: assets carry the release-wide prefix
            # (`...-v1.0-xiao_esp32s3-mcuboot.bin`) and the stager names a
            # staged part after the file it was handed. Without the rename,
            # CI would publish part filenames that a local `./build.sh` never
            # produces, and the manifest would differ by which machine wrote
            # it.
            # `${a[@]+"${a[@]}"}` at the call, not a bare `"${a[@]}"`: this
            # step runs under `set -u`, and expanding an empty array that way
            # is an unbound-variable error in bash 3.x. Every single-file
            # board takes that path, so it would be the common case failing,
            # not the new one.
            partargs=()
            if [ -f "${base}-parts.txt" ]; then
              partdir="$(mktemp -d)"
              want=0
              missing=""
              while IFS='@' read -r name off; do
                [ -n "${name}" ] || continue
                want=$((want + 1))
                if [ ! -f "${base}-${name}" ]; then
                  missing="${missing} ${name}"
                  continue
                fi
                cp "${base}-${name}" "${partdir}/${name}"
                partargs+=(--part "${partdir}/${name}@${off}")
              done < "${base}-parts.txt"

              # All or nothing. A partial parts board is worse than an absent
              # one: the client would offer it, the flasher would write it,
              # and a board that got a bootloader and no application does not
              # boot and has no console to say so (Trap 6). "This release has
              # no ESP32 build" is a true statement a user can act on.
              if [ -n "${missing}" ]; then
                echo "::warning::${board}: not published:${missing} — skipping this board entirely"
                continue
              fi
              if [ "${want}" -eq 0 ]; then
                echo "::warning::${board}: parts.txt is empty — skipping"
                continue
              fi
            fi

            node web/tools/stage-firmware.mjs \
              --board "${board}" \
              --out _site/firmware --tag "${TAG}" \
              --hex "${base}-merged.hex" \
              --uf2 "${base}-merged.uf2" \
              --dfu "${base}-dfu.zip" \
              ${partargs[@]+"${partargs[@]}"}
            staged=$((staged + 1))
          done

          if [ "${staged}" -eq 0 ]; then
            echo "::warning::release ${TAG} staged no boards — firmware unavailable"
            rm -rf _site/firmware
            exit 0
          fi
          echo "staged ${staged} board(s)"
          find _site/firmware -type f | sort

      - uses: actions/upload-pages-artifact@v5
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
        with:
          path: _site

  deploy:
    needs: test
    # Only after a successful firmware build, or by hand. Never on a push:
    # pushes run the tests and stop.
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
