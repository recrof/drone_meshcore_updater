name: Web client

# The web client is plain ES modules — no build step for development. This
# workflow only (a) runs the tests, (b) publishes web/ to GitHub Pages, and
# (c) bundles a single self-contained updater.html for people who'd rather
# host one file than a directory.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Schema tests (no dependencies)
        run: node web/test/config-file.test.mjs

      - name: Bundle single-file build
        run: node web/tools/build-single.mjs web/dist/updater.html

      - name: Render tests
        run: |
          npm install --no-save jsdom
          node web/test/render.test.mjs web/dist/updater.html

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r web/index.html web/css web/js web/vendor _site/
          cp web/dist/updater.html _site/updater.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload single-file build
        uses: actions/upload-artifact@v4
        with:
          name: updater-single-file
          path: web/dist/updater.html

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
