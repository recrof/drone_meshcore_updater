name: Web client

# The web client is plain ES modules — no build step for development. This
# workflow runs the tests, publishes web/ to GitHub Pages, and bundles a single
# self-contained updater.html for people who'd rather host one file.
#
# Pages must be enabled for the repo with Source = "GitHub Actions"
# (Settings -> Pages). Without it, deploy-pages fails with a bare 404:
# "Failed to create deployment ... Ensure GitHub Pages has been enabled".

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Schema tests (no dependencies)
        run: node web/test/config-file.test.mjs

      - name: PWA manifest / precache tests
        run: node web/test/pwa.test.mjs

      - name: Bundle single-file build
        run: node web/tools/build-single.mjs web/dist/updater.html

      # Re-run now that dist/ exists: the single-file build has to have had
      # its manifest and icon links stripped, or it registers a service
      # worker for an sw.js that isn't next to it.
      - name: PWA single-file checks
        run: node web/test/pwa.test.mjs

      - name: Render tests
        run: |
          npm install --no-save jsdom
          node web/test/render.test.mjs web/dist/updater.html

      - name: Upload single-file build
        uses: actions/upload-artifact@v7
        with:
          name: updater-single-file
          path: web/dist/updater.html

      # Only stage/upload the Pages artifact when we are actually going to
      # deploy. On a PR it would be built and thrown away.
      - name: Stage site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp -r web/index.html web/css web/js web/vendor web/icons _site/
          # sw.js must sit at the site root: a worker's scope cannot be
          # broader than the directory it is served from.
          cp web/sw.js web/manifest.webmanifest _site/
          cp web/dist/updater.html _site/updater.html

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
