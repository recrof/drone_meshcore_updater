name: Web client

# The web client is plain ES modules — no build step for development. This
# workflow runs the tests, publishes web/ to GitHub Pages, and bundles a single
# self-contained updater.html for people who'd rather host one file.
#
# Pages must be enabled for the repo with Source = "GitHub Actions"
# (Settings -> Pages). Without it, deploy-pages fails with a bare 404:
# "Failed to create deployment ... Ensure GitHub Pages has been enabled".

# Deploys are tied to releases; pushes only run the tests.
#
# Both used to deploy, so committing and then publishing a release fired two
# runs seconds apart that built the same site. `concurrency: pages` collapsed
# them, but the second one was still redundant work and made the run list hard
# to read. Tests still guard every push to main — losing that to remove a
# duplicate deploy would be a bad trade.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  # Deploy after the firmware build finishes, not when the release is
  # published. Two reasons, both learned the hard way:
  #
  #  1. **Ordering.** Publishing fires this and build.yml at the same instant,
  #     so the staging step went looking for release assets that were still
  #     minutes from existing.
  #  2. **The github-pages environment rejects tag refs.** Its default
  #     protection rule allows only the default branch, and a release event's
  #     ref is refs/tags/vX — "Tag v1.1 is not allowed to deploy to
  #     github-pages due to environment protection rules". A `workflow_run`
  #     event runs in the *default branch* context, which the rule permits.
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # workflow_run and workflow_dispatch both give a branch ref, so plain
      # checkout is correct: the app always tracks the default branch, and
      # only the *firmware asset* comes from the release.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Schema tests (no dependencies)
        run: node web/test/config-file.test.mjs

      - name: PWA manifest / precache tests
        run: node web/test/pwa.test.mjs

      # The half of the USB flasher that can be tested without a probe. The
      # rest (CMSIS-DAP, SWD, RRAM) needs hardware.
      - name: Intel HEX tests
        run: node web/test/intel-hex.test.mjs

      - name: CMSIS-DAP / SWD encoding tests
        run: node web/test/cmsis-dap.test.mjs

      # Cross-checks the log file naming against updater/prj.conf.
      - name: Log file tests
        run: node web/test/log-file.test.mjs

      # Cross-checks the live DFU status layout, enums and service UUIDs
      # against updater/src/dfu_status.[ch]. A renumbered state parses fine
      # and reports the wrong step, so nothing at run time would catch it.
      - name: DFU status wire-format tests
        run: node web/test/dfu-status.test.mjs

      # Catches mistyped this.x() in the hardware-driving modules, which jsdom
      # cannot execute and whose error paths only run against a real device.
      - name: Self-call check
        run: node web/test/self-calls.test.mjs

      # Header layout + DFU zip, cross-checked against the real build when one
      # is present.
      - name: MCUboot image tests
        run: node web/test/mcuboot-image.test.mjs

      - name: Bundle single-file build
        run: node web/tools/build-single.mjs web/dist/updater.html

      # Re-run now that dist/ exists: the single-file build has to have had
      # its manifest and icon links stripped, or it registers a service
      # worker for an sw.js that isn't next to it.
      - name: PWA single-file checks
        run: node web/test/pwa.test.mjs

      - name: Render tests
        run: |
          npm install --no-save jsdom
          node web/test/render.test.mjs web/dist/updater.html
          node web/test/flash-dialog.test.mjs web/dist/updater.html
          node web/test/dfu-banner.test.mjs

      - name: Upload single-file build
        uses: actions/upload-artifact@v7
        with:
          name: updater-single-file
          path: web/dist/updater.html

      # Only stage/upload the Pages artifact when we are actually going to
      # deploy. On a push or a PR it would be built and thrown away.
      - name: Stage site
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p _site
          cp -r web/index.html web/css web/js web/vendor web/icons _site/
          # sw.js must sit at the site root: a worker's scope cannot be
          # broader than the directory it is served from.
          cp web/sw.js web/manifest.webmanifest _site/
          cp web/dist/updater.html _site/updater.html

      # Publish the newest release's merged.hex next to the app, so "Flash
      # newest" is one click and needs no GitHub round trip from the browser.
      #
      # Deliberately never fails the build. There is nothing to publish until
      # a release exists, and build.yml creates releases as DRAFTS — a draft's
      # assets are not downloadable, so the site correctly shows "no published
      # build available" until someone publishes one.
      - name: Stage newest firmware
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty now that the deploy follows the build rather than the
          # release event; the "newest published release" query below is the
          # only path. Kept as a hook for a future direct-release trigger.
          RELEASE_TAG: ""
        run: |
          set -u
          mkdir -p _site/firmware

          TAG="${RELEASE_TAG:-}"
          if [ -z "${TAG}" ]; then
            TAG=$(gh release list --limit 10 --json tagName,isDraft \
                    --jq '[.[] | select(.isDraft | not)] | .[0].tagName // empty' 2>/dev/null || true)
          fi
          if [ -z "${TAG}" ]; then
            echo "::notice::no published release yet — 'Flash newest' will be unavailable"
            exit 0
          fi
          echo "staging firmware from ${TAG}"

          # Retry briefly. With build.yml's default (draft: true) the assets
          # are always present by the time a human can publish, so this never
          # loops. It matters if anyone sets draft: false: the release is then
          # created already-published, which fires this workflow *before*
          # softprops has finished uploading, and the asset appears seconds
          # later.
          ok=""
          for attempt in 1 2 3 4 5; do
            if gh release download "${TAG}" --pattern '*-merged.hex' \
                 --output _site/firmware/merged.hex --clobber; then
              ok=yes
              break
            fi
            echo "attempt ${attempt}: no *-merged.hex on ${TAG} yet, waiting…"
            sleep 10
          done
          if [ -z "${ok}" ]; then
            echo "::warning::release ${TAG} has no *-merged.hex asset — 'Flash newest' will be unavailable"
            rm -f _site/firmware/merged.hex
            exit 0
          fi

          # Same script a developer runs locally, so the manifest schema has
          # exactly one producer and cannot drift from its reader.
          # The OTA image for "Update over Bluetooth". Optional: a release
          # predating MCUboot has no such asset, and the USB route still works.
          if ! gh release download "${TAG}" --pattern '*-dfu.zip' \
                 --output _site/firmware/dfu_application.zip --clobber; then
            echo "::notice::${TAG} has no *-dfu.zip — Bluetooth updates unavailable"
            rm -f _site/firmware/dfu_application.zip
          fi

          node web/tools/stage-firmware.mjs _site/firmware/merged.hex \
            --dfu _site/firmware/dfu_application.zip \
            --out _site/firmware --tag "${TAG}"
          ls -la _site/firmware/

      - uses: actions/upload-pages-artifact@v5
        if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
        with:
          path: _site

  deploy:
    needs: test
    # Only after a successful firmware build, or by hand. Never on a push:
    # pushes run the tests and stop.
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
