name: Build & Release

permissions:
  contents: write

# One firmware build at a time, keyed on the ref. Publishing a release from
# the UI creates the tag, which fires this workflow's `push: tags` as well as
# the release event — so a tag can be built twice, seconds apart, and the
# second sat queued behind the first. Newer wins; there is no value in
# finishing a build whose successor is already running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    tags:
      # Release tags are vX.XX (v1.0, v1.02). Note that a tag filter too
      # strict to match what you pushed produces no run and no error, so keep
      # it loose about digit counts.
      - 'v[0-9]*.[0-9]*'

  # **This trigger is why v1.1 did not build.** `push` fires on a git push;
  # creating a tag through the Releases web UI creates the ref through the
  # API, which fires `create`, not `push`. v1.0 was a `git push --tags` and
  # built; v1.1 was made in the UI and the firmware workflow never saw it,
  # while publishing still fired the web deploy — which then went looking for
  # assets that were never built.
  release:
    types: [published]

jobs:
  build:
    # Nordic's official NCS toolchain container has west + the ARM
    # cross-compiler + all Python deps pre-installed, so we skip the
    # per-run west init dance.
    runs-on: ubuntu-latest
    defaults:
      run:
        # REQUIRED, and not merely tidy. The toolchain image puts west, cmake
        # and the cross-compiler on PATH through BASH_ENV
        # (/opt/non-interactive-setup.sh) rather than in the image's own PATH
        # — and only bash reads BASH_ENV. Actions defaults *container* steps
        # to `sh -e {0}`, so the first real run got
        #   PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        # and no toolchain at all. The staging step is bash-only as well
        # ([[ ]] and ${GITHUB_SHA::7}), so it would have failed next.
        shell: bash
    container:
      # Must track `revision:` in updater/west.yml — the toolchain image and
      # the SDK it builds are versioned together. The step below fails the
      # job if the two drift apart.
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        # Default checkout goes to $GITHUB_WORKSPACE — that's the workspace
        # root layout the local dev flow uses too. `updater/` inside it is
        # the manifest project.

      - name: Toolchain image matches the pinned SDK
        run: |
          MANIFEST=$(sed -n 's/^ *revision: *\(v[0-9.]*\) *$/\1/p' updater/west.yml)
          IMAGE=v3.4.0
          echo "west.yml pins NCS ${MANIFEST}; container is ${IMAGE}"
          [ "$MANIFEST" = "$IMAGE" ] || {
            echo "::error::sdk-nrf-toolchain:${IMAGE} does not match the NCS" \
                 "revision ${MANIFEST} pinned in updater/west.yml." \
                 "Bump the container image in this workflow."
            exit 1
          }

      - name: Trust the checkout
        # actions/checkout runs as a different user than the image's, so git
        # refuses to operate on the tree ("dubious ownership") and west update
        # dies on the first fetch.
        run: git config --global --add safe.directory '*'

      - name: Put the toolchain on PATH
        run: |
          # Belt and braces. `shell: bash` on the job should make BASH_ENV
          # fire on its own; if it ever does not, run the image's own setup
          # rather than guessing install paths.
          if ! command -v west >/dev/null 2>&1; then
            if [ -n "${BASH_ENV:-}" ] && [ -f "${BASH_ENV}" ]; then
              echo "BASH_ENV did not fire; sourcing ${BASH_ENV} explicitly"
              . "${BASH_ENV}"
            fi
          fi

          missing=""
          for tool in west cmake ninja python3; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::toolchain not on PATH — missing:$missing"
            echo "BASH_ENV=${BASH_ENV:-unset}"
            echo "PATH=$PATH"
            ls -la /opt 2>/dev/null || true
            exit 1
          fi

          # Persist for every later step, so nothing downstream depends on
          # which shell Actions picks or on BASH_ENV firing again.
          echo "PATH=$PATH" >> "$GITHUB_ENV"

          # No pipes here on purpose: `shell: bash` implies -o pipefail, and
          # `cmd | head -1` can fail the step on SIGPIPE.
          west --version
          cmake --version
          python3 --version

      # Set the firmware version from the tag before building, so the value
      # baked into the MCUboot image header — shown by the web client and
      # logged at boot — always matches the release, with nothing to remember.
      #
      # The trade, chosen deliberately: the released artifact is not what
      # building this tag locally produces, because the VERSION committed to
      # git still says whatever it said. The image reports its true version in
      # its own header either way, so a device can always be identified.
      - name: Set the firmware version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 updater/tools/set_version.py "${GITHUB_REF_NAME}"
          cat updater/VERSION

      - name: Initialize west workspace
        run: west init -l updater

      - name: West update
        # --narrow -o=--depth=1 keeps clones shallow; NCS + zephyr + modules
        # is otherwise multi-GB per run.
        run: west update --narrow -o=--depth=1

      - name: Build firmware
        run: west build -b xiao_nrf54lm20a/nrf54lm20a/cpuapp updater --build-dir updater/build

      - name: Stage release artifacts
        run: |
          mkdir -p out
          VER="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VER="dev-${GITHUB_SHA::7}"
          BASE="xiao_nrf54_updater-${VER}"
          # Sysbuild nests each image domain: the app is under
          # <build>/updater/zephyr and the bootloader under
          # <build>/mcuboot/zephyr. <build>/zephyr exists but holds only
          # sysbuild's own Kconfig output, so copying from it fails.
          APP=updater/build/updater/zephyr
          BOOT=updater/build/mcuboot/zephyr

          # The one file a normal user needs: MCUboot + the signed
          # application, ready for any SWD probe. zephyr.hex on its own links
          # at 0x10000 and will NOT boot without a bootloader under it, so it
          # is deliberately not published as a flashable artifact.
          python3 updater/tools/merge_hex.py "out/${BASE}-merged.hex" \
            "${BOOT}/zephyr.hex" "${APP}/zephyr.signed.hex"

          # OTA update of the updater itself, for nRF Connect Device Manager.
          cp updater/build/dfu_application.zip out/${BASE}-dfu.zip
          cp ${APP}/zephyr.signed.bin          out/${BASE}-app.signed.bin

          # Unsigned, bootloader-relative — debugging only.
          cp ${APP}/zephyr.elf out/${BASE}.elf
          ls -la out/

      - name: Verify the merged image
        # merge_hex.py refuses to overlap, so a layout regression (MCUboot
        # linked into slot0, slots resized past storage) fails here rather
        # than producing an image that flashes and does not boot.
        run: |
          python3 - <<'EOF'
          import sys, glob
          sys.path.insert(0, "updater/tools")
          from merge_hex import parse
          m = parse(glob.glob("out/*-merged.hex")[0])
          lo, hi = min(m), max(m)
          print(f"merged image: {len(m)} bytes, {lo:#010x}..{hi:#010x}")
          assert lo == 0, f"image does not start at 0 (got {lo:#x}) — no reset vector"
          assert 0x10000 in m, "nothing at slot0 (0x10000) — application missing"
          assert hi < 0x1d0000, f"image runs into storage_partition ({hi:#x})"
          EOF

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: out/*

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # A tag push creates the release as a draft, so a bad build can be
          # discarded before anyone flashes it. When the run was triggered BY
          # a release, that release already exists and is published — forcing
          # draft here would un-publish it.
          draft: ${{ github.event_name != 'release' }}
          files: out/*
