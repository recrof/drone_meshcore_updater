name: Build & Release

permissions:
  contents: write

# One firmware build at a time, keyed on the ref. Publishing a release from
# the UI creates the tag, which fires this workflow's `push: tags` as well as
# the release event — so a tag can be built twice, seconds apart, and the
# second sat queued behind the first. Newer wins; there is no value in
# finishing a build whose successor is already running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    tags:
      # Release tags are vX.XX (v1.0, v1.02). Note that a tag filter too
      # strict to match what you pushed produces no run and no error, so keep
      # it loose about digit counts.
      - 'v[0-9]*.[0-9]*'

  # **This trigger is why v1.1 did not build.** `push` fires on a git push;
  # creating a tag through the Releases web UI creates the ref through the
  # API, which fires `create`, not `push`. v1.0 was a `git push --tags` and
  # built; v1.1 was made in the UI and the firmware workflow never saw it,
  # while publishing still fired the web deploy — which then went looking for
  # assets that were never built.
  release:
    types: [published]

jobs:
  build:
    # Nordic's official NCS toolchain container has west + the ARM
    # cross-compiler + all Python deps pre-installed, so we skip the
    # per-run west init dance.
    runs-on: ubuntu-latest
    strategy:
      # One board's failure must not cancel the others: a release with two of
      # three boards attached is useful, and which board broke is the thing
      # you want to see. The staging side is per-board too, so a missing
      # asset degrades to "nothing published for that board" rather than to a
      # broken index.
      fail-fast: false
      matrix:
        include:
          # `slug` is the board name, and it goes in the asset filename so the
          # staging step reads the board off the asset rather than keeping its
          # own copy of this list.
          #
          # slot0/low/limit are this board's partition geometry, from
          # updater/rram_partitions.dtsi and updater/nrf52840_partitions.dtsi.
          # They are what the merged-image check asserts against; they used to
          # be nRF54L constants written inline, which would have passed
          # vacuously for any other board.
          - board: xiao_nrf54lm20a/nrf54lm20a/cpuapp
            slug: xiao_nrf54lm20a
            low: "0x0"        # MCUboot links at 0 — reset vector lives here
            slot0: "0x10000"
            limit: "0x1d0000" # storage_partition
          - board: xiao_ble/nrf52840
            slug: xiao_ble
            low: "0x27000"    # under it sits the Adafruit UF2 bootloader
            slot0: "0x31000"
            limit: "0xf4000"  # uf2_boot_partition — overwriting it bricks USB
          # The second nRF52840, and the numbers are NOT the ones above.
          # RAK's bootloader is built against SoftDevice S140 6.1.1 where
          # Seeed's is 7.3.0, so the application region starts one flash page
          # lower. `slot0 in m` is a weak assertion — it passes for any address
          # inside the image — so a row copied from the XIAO would look fine
          # while checking nothing. stage-firmware.test.mjs holds all three
          # numbers to updater/rak4631_partitions.dtsi.
          - board: rak4631/nrf52840
            slug: rak4631
            low: "0x26000"    # MBR + SoftDevice S140 6.1.1 sit below it
            slot0: "0x30000"
            limit: "0xf4000"  # uf2_boot_partition — overwriting it bricks USB
          # The XIAO MG24 *is* a row here, unlike the Espressif boards, and the
          # reason is only about the compiler: this is a Cortex-M33, so the ARM
          # cross-compiler in Nordic's container builds it. What it does need is
          # the Silabs radio blobs — see the `blobs:` key and the step that
          # consumes it. Without them CONFIG_BT_SILABS_EFR32 is not selectable
          # and Bluetooth silently does not exist in the image.
          #
          # Note the addresses: this part's flash is mapped at 0x08000000, not
          # at 0. A row copied from either nRF board above would assert
          # `lo == 0` against an image that legitimately starts 128 MB higher.
          - board: xiao_mg24/efr32mg24b220f1536im48
            slug: xiao_mg24
            blobs: hal_silabs
            low: "0x8000000"   # MCUboot links at the base of flash
            slot0: "0x8010000"
            limit: "0x817c000" # storage_partition
          # NOT here: xiao_esp32s3. This container is Nordic's and carries no
          # Xtensa toolchain, and the Espressif build additionally needs
          # `west blobs fetch hal_espressif`. Adding it means a second job with
          # a different image, not another matrix row — see notes/ci-release.md.
    defaults:
      run:
        # REQUIRED, and not merely tidy. The toolchain image puts west, cmake
        # and the cross-compiler on PATH through BASH_ENV
        # (/opt/non-interactive-setup.sh) rather than in the image's own PATH
        # — and only bash reads BASH_ENV. Actions defaults *container* steps
        # to `sh -e {0}`, so the first real run got
        #   PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        # and no toolchain at all. The staging step is bash-only as well
        # ([[ ]] and ${GITHUB_SHA::7}), so it would have failed next.
        shell: bash
    container:
      # Must track `revision:` in updater/west.yml — the toolchain image and
      # the SDK it builds are versioned together. The step below fails the
      # job if the two drift apart.
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain:v3.4.0
    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        # Default checkout goes to $GITHUB_WORKSPACE — that's the workspace
        # root layout the local dev flow uses too. `updater/` inside it is
        # the manifest project.

      - name: Toolchain image matches the pinned SDK
        run: |
          MANIFEST=$(sed -n 's/^ *revision: *\(v[0-9.]*\) *$/\1/p' updater/west.yml)
          IMAGE=v3.4.0
          echo "west.yml pins NCS ${MANIFEST}; container is ${IMAGE}"
          [ "$MANIFEST" = "$IMAGE" ] || {
            echo "::error::sdk-nrf-toolchain:${IMAGE} does not match the NCS" \
                 "revision ${MANIFEST} pinned in updater/west.yml." \
                 "Bump the container image in this workflow."
            exit 1
          }

      - name: Trust the checkout
        # actions/checkout runs as a different user than the image's, so git
        # refuses to operate on the tree ("dubious ownership") and west update
        # dies on the first fetch.
        run: git config --global --add safe.directory '*'

      - name: Put the toolchain on PATH
        run: |
          # Belt and braces. `shell: bash` on the job should make BASH_ENV
          # fire on its own; if it ever does not, run the image's own setup
          # rather than guessing install paths.
          if ! command -v west >/dev/null 2>&1; then
            if [ -n "${BASH_ENV:-}" ] && [ -f "${BASH_ENV}" ]; then
              echo "BASH_ENV did not fire; sourcing ${BASH_ENV} explicitly"
              . "${BASH_ENV}"
            fi
          fi

          missing=""
          for tool in west cmake ninja python3; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::toolchain not on PATH — missing:$missing"
            echo "BASH_ENV=${BASH_ENV:-unset}"
            echo "PATH=$PATH"
            ls -la /opt 2>/dev/null || true
            exit 1
          fi

          # Persist for every later step, so nothing downstream depends on
          # which shell Actions picks or on BASH_ENV firing again.
          echo "PATH=$PATH" >> "$GITHUB_ENV"

          # No pipes here on purpose: `shell: bash` implies -o pipefail, and
          # `cmd | head -1` can fail the step on SIGPIPE.
          west --version
          cmake --version
          python3 --version

      # Set the firmware version from the tag before building, so the value
      # baked into the MCUboot image header — shown by the web client and
      # logged at boot — always matches the release, with nothing to remember.
      #
      # The trade, chosen deliberately: the released artifact is not what
      # building this tag locally produces, because the VERSION committed to
      # git still says whatever it said. The image reports its true version in
      # its own header either way, so a device can always be identified.
      - name: Set the firmware version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 updater/tools/set_version.py "${GITHUB_REF_NAME}"
          cat updater/VERSION

      - name: Initialize west workspace
        run: west init -l updater

      - name: West update
        # --narrow -o=--depth=1 keeps clones shallow; NCS + zephyr + modules
        # is otherwise multi-GB per run.
        run: west update --narrow -o=--depth=1

      - name: Fetch vendor blobs
        # Only the rows that declare one. `west blobs fetch` is a large
        # download and every board here but the MG24 needs nothing, so this is
        # keyed off the matrix rather than run unconditionally.
        #
        # It is not optional where it applies: `BT_SILABS_EFR32 depends on
        # ZEPHYR_HAL_SILABS_MODULE_BLOBS`, and Kconfig drops an assignment
        # whose dependencies are unmet without a word — so a missing fetch
        # produces a build that succeeds and an image with no Bluetooth.
        if: matrix.blobs != ''
        run: west blobs fetch ${{ matrix.blobs }}

      - name: Build firmware
        run: west build -b ${{ matrix.board }} updater --build-dir updater/build

      - name: Bluetooth is actually in the image
        # The failure this catches is silent by construction: a dropped
        # Kconfig (missing blobs, a renamed symbol) leaves a firmware that
        # boots, advertises nothing, and reports no error anywhere. Ask the
        # generated .config, never the fragment — the standing rule.
        run: |
          CFG=updater/build/updater/zephyr/.config
          grep -q '^CONFIG_BT=y' "$CFG" || {
            echo "::error::CONFIG_BT is not set in the built image"; exit 1; }
          grep -q '^CONFIG_BT_CENTRAL=y' "$CFG" || {
            echo "::error::CONFIG_BT_CENTRAL is not set — this device could not flash a target"
            exit 1; }
          echo "BT: $(grep -c '^CONFIG_BT' "$CFG") symbols set"

      - name: Stage release artifacts
        run: |
          mkdir -p out
          VER="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VER="dev-${GITHUB_SHA::7}"
          # The board is IN the asset name. web.yml reads it back off the
          # filename to stage per-board, so this is the single source of truth
          # for which board an artifact is for — the alternative, a hard-coded
          # board string in the staging step, is a second copy that drifts.
          BASE="drone_meshcore_updater-${VER}-${{ matrix.slug }}"
          # Sysbuild nests each image domain: the app is under
          # <build>/updater/zephyr and the bootloader under
          # <build>/mcuboot/zephyr. <build>/zephyr exists but holds only
          # sysbuild's own Kconfig output, so copying from it fails.
          APP=updater/build/updater/zephyr
          BOOT=updater/build/mcuboot/zephyr

          # The one file a normal user needs: MCUboot + the signed
          # application, ready for any SWD probe. zephyr.hex on its own links
          # at 0x10000 and will NOT boot without a bootloader under it, so it
          # is deliberately not published as a flashable artifact.
          python3 updater/tools/merge_hex.py "out/${BASE}-merged.hex" \
            "${BOOT}/zephyr.hex" "${APP}/zephyr.signed.hex"

          # OTA update of the updater itself, for nRF Connect Device Manager.
          cp updater/build/dfu_application.zip out/${BASE}-dfu.zip
          cp ${APP}/zephyr.signed.bin          out/${BASE}-app.signed.bin

          # Where the bootloader takes a .uf2, that — not the hex — is the
          # file a user without a probe can actually install, by dragging it
          # onto the mass-storage device the board exposes. On the nRF52840 it
          # is also the *recovery* path: its serial DFU is single-bank, so a
          # failed transfer leaves no application at all.
          #
          # This is generated here rather than copied. build.sh's merge_uf2()
          # does it locally, but CI runs `west build` directly and merge_hex.py
          # writes straight into out/, so updater/build/merged.uf2 never exists
          # on a runner. This step used to be `if [ -f ... ]; then cp; fi`,
          # which meant it quietly copied nothing, every release, and the only
          # symptom was a download link the web client never rendered — a
          # missing affordance looks exactly like one that was never meant to
          # exist. v1.5 shipped without it.
          #
          # Both facts come out of the build, as they do in build.sh: Zephyr
          # already knows whether the board wants UF2 and which family ID its
          # bootloader accepts. A wrong family ID is rejected by the
          # bootloader; a missing one silently produces a file no bootloader
          # will take.
          if grep -q '^CONFIG_BUILD_OUTPUT_UF2=y' "${APP}/.config"; then
            FAMILY=$(sed -n 's/^CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="\(.*\)"/\1/p' \
                     "${APP}/.config")
            if [ -z "${FAMILY}" ]; then
              echo "::error::${{ matrix.slug }} wants UF2 but declares no family ID"
              exit 1
            fi
            python3 zephyr/scripts/build/uf2conv.py "out/${BASE}-merged.hex" \
              -f "${FAMILY}" -c -o "out/${BASE}-merged.uf2"
            # Loud, not conditional: this board's drag-and-drop install and its
            # only recovery route both depend on the file existing.
            [ -s "out/${BASE}-merged.uf2" ] || {
              echo "::error::uf2conv produced nothing for ${{ matrix.slug }}"; exit 1; }
            echo "merged.uf2: $(wc -c < "out/${BASE}-merged.uf2") bytes, family ${FAMILY}"
          fi

          # The full board target, next to the artifacts it describes.
          #
          # The asset name can only carry the board *name* (xiao_ble) — a
          # target contains slashes. But the client compares the manifest's
          # board against what the device reports over os_mgmt, and since
          # Zephyr 4.3 that is the full target, variant and all
          # ("xiao_ble/nrf52840"). Encoding it in the filename is not
          # reversible, and a slug->target table in web.yml would be a second
          # copy of this matrix. So the build writes down what it built.
          echo "${{ matrix.board }}" > out/${BASE}-board.txt

          # Unsigned, bootloader-relative — debugging only.
          cp ${APP}/zephyr.elf out/${BASE}.elf
          ls -la out/

      - name: Verify the merged image
        # merge_hex.py refuses to overlap, so a layout regression (MCUboot
        # linked into slot0, slots resized past storage) fails here rather
        # than producing an image that flashes and does not boot.
        run: |
          python3 - <<'EOF'
          import sys, glob
          sys.path.insert(0, "updater/tools")
          from merge_hex import parse
          m = parse(glob.glob("out/*-merged.hex")[0])
          lo, hi = min(m), max(m)
          low, slot0, limit = (int("${{ matrix.low }}", 16),
                               int("${{ matrix.slot0 }}", 16),
                               int("${{ matrix.limit }}", 16))
          print(f"merged image: {len(m)} bytes, {lo:#010x}..{hi:#010x}")
          assert lo == low, f"image starts at {lo:#x}, expected {low:#x}"
          assert slot0 in m, f"nothing at slot0 ({slot0:#x}) — application missing"
          assert hi < limit, f"image runs past {limit:#x} ({hi:#x})"
          EOF

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          # Unique per board: upload-artifact refuses a name that already
          # exists, so a shared one fails the second matrix job to finish.
          name: firmware-${{ matrix.slug }}
          path: out/*

  # The Espressif boards, which cannot be rows in the matrix above.
  #
  # Three things separate them from it, and only the first is about the
  # compiler:
  #
  #  1. **No Espressif toolchain in Nordic's container.** That image carries
  #     the ARM cross-compiler and nothing else, so this job runs on a plain
  #     runner and installs the Zephyr SDK with the toolchains it needs.
  #  2. **Blobs.** The Espressif HAL ships its radio as prebuilt libraries
  #     that west fetches separately; without them the link fails late, on
  #     missing symbols, long after anything points at the cause.
  #  3. **No single-file image.** Every other board publishes a merged.hex
  #     that a flasher writes at one address. These publish two binaries
  #     written at two offsets, so they also publish where they go — see the
  #     parts.txt step, which asks the stager rather than writing the offsets
  #     down here.
  #
  # It is its own matrix rather than more rows in the Nordic one because
  # everything above is shared between the Espressif boards and none of it is
  # shared with the nRF boards. Two architectures are involved — Xtensa on the
  # S3, RISC-V on the C5 — but both toolchains come from the one SDK install
  # below, so that is not what splits the jobs.
  build-esp32:
    runs-on: ubuntu-latest
    strategy:
      # Same reasoning as the Nordic matrix: one board's failure must not
      # cancel the other, and the release job tolerates a missing board.
      fail-fast: false
      matrix:
        include:
          - board: xiao_esp32s3/esp32s3/procpu
            slug: xiao_esp32s3
          - board: xiao_esp32c5/esp32c5/hpcore
            slug: xiao_esp32c5
    steps:
      - uses: actions/checkout@v7

      - name: Install the Zephyr SDK and toolchains
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: updater
          # Must track `revision:` in updater/west.yml the same way the
          # container image does for the Nordic job. The check below fails
          # this job if they drift.
          sdk-version: 1.0.1
          # Only what these boards need. The full SDK is several GB and most
          # of it is other people's silicon. Both are installed for both
          # matrix rows: splitting them per row would save a couple of minutes
          # and add a way for a row to be given the wrong compiler, which
          # fails as a confusing configure error rather than as a clear one.
          #   xtensa-espressif_esp32s3_zephyr-elf  -> xiao_esp32s3
          #   riscv64-zephyr-elf                   -> xiao_esp32c5
          toolchains: xtensa-espressif_esp32s3_zephyr-elf:riscv64-zephyr-elf

      - name: Fetch the Espressif blobs
        # The radio is a prebuilt library, not source, and it is not in the
        # manifest checkout. Missing blobs surface as undefined references at
        # link time with nothing naming the real cause.
        run: west blobs fetch hal_espressif

      - name: Set the firmware version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 updater/tools/set_version.py "${GITHUB_REF_NAME}"
          cat updater/VERSION

      - name: Install esptool
        # zephyr/soc/espressif/common/CMakeLists.txt invokes the bare name
        # `esptool` from PATH in a post-build step, and a version that is
        # merely present is not enough — 4.x rejects 5.x's hyphenated options
        # and fails after both images have linked. build.sh keeps its own venv
        # locally for exactly this reason; here we just pin it.
        run: pipx install 'esptool>=5.0.2' || pip install --user 'esptool>=5.0.2'

      - name: Fetch vendor blobs
        # Only the rows that declare one. `west blobs fetch` is a large
        # download and every board here but the MG24 needs nothing, so this is
        # keyed off the matrix rather than run unconditionally.
        #
        # It is not optional where it applies: `BT_SILABS_EFR32 depends on
        # ZEPHYR_HAL_SILABS_MODULE_BLOBS`, and Kconfig drops an assignment
        # whose dependencies are unmet without a word — so a missing fetch
        # produces a build that succeeds and an image with no Bluetooth.
        if: matrix.blobs != ''
        run: west blobs fetch ${{ matrix.blobs }}

      - name: Build firmware
        run: west build -b ${{ matrix.board }} updater --build-dir updater/build

      - name: Bluetooth is actually in the image
        # The failure this catches is silent by construction: a dropped
        # Kconfig (missing blobs, a renamed symbol) leaves a firmware that
        # boots, advertises nothing, and reports no error anywhere. Ask the
        # generated .config, never the fragment — the standing rule.
        run: |
          CFG=updater/build/updater/zephyr/.config
          grep -q '^CONFIG_BT=y' "$CFG" || {
            echo "::error::CONFIG_BT is not set in the built image"; exit 1; }
          grep -q '^CONFIG_BT_CENTRAL=y' "$CFG" || {
            echo "::error::CONFIG_BT_CENTRAL is not set — this device could not flash a target"
            exit 1; }
          echo "BT: $(grep -c '^CONFIG_BT' "$CFG") symbols set"

      - name: Stage release artifacts
        run: |
          mkdir -p out
          VER="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VER="dev-${GITHUB_SHA::7}"
          BASE="drone_meshcore_updater-${VER}-${{ matrix.slug }}"

          # Same contract as the Nordic job: the build writes down what it
          # built, and the staging side reads it back rather than keeping its
          # own copy of this list.
          echo "${{ matrix.board }}" > "out/${BASE}-board.txt"

          # And, for a board with no single-file image, WHERE each piece goes.
          # The offsets come from the stager's PART_LAYOUT — which a test
          # holds against each board's *_partitions.dtsi — so they are not
          # written down here, or in web.yml, or anywhere a third copy could
          # rot. They are NOT the same on both boards — the C5's ROM reserves
          # the first sectors of flash and the S3's does not, so the two
          # bootloaders start in different places — which is exactly why
          # asking the stager beats writing anything down here. (Naming the
          # actual numbers in this comment is what the "writes down no part
          # offsets" test forbids, and rightly: a number in a comment is read
          # as authoritative and is updated by nobody.)
          : > "out/${BASE}-parts.txt"
          node web/tools/stage-firmware.mjs \
            --board ${{ matrix.board }} --emit-parts > parts.tsv
          [ -s parts.tsv ] || { echo "::error::stager emitted no parts layout"; exit 1; }
          while IFS=$'\t' read -r src name off; do
            cp "updater/build/${src}" "out/${BASE}-${name}"
            echo "${name}@${off}" >> "out/${BASE}-parts.txt"
          done < parts.tsv
          cat "out/${BASE}-parts.txt"

          # OTA update of the updater itself, same as every other board.
          cp updater/build/dfu_application.zip "out/${BASE}-dfu.zip"
          cp updater/build/updater/zephyr/zephyr.elf "out/${BASE}.elf"
          ls -la out/

      - name: Verify the images fit their partitions
        # The parts-board equivalent of the merged-image overlap check. There
        # is no merged file to inspect, so the assertion is that each image
        # fits in the gap before the next offset — a bootloader that has grown
        # past slot0 would otherwise be published, flash clean, verify clean
        # (MD5 checks what was written where it was written) and not boot.
        run: |
          python3 - <<'EOF'
          import glob, os, re
          base = glob.glob("out/*-parts.txt")[0]
          parts = []
          for line in open(base):
              line = line.strip()
              if not line:
                  continue
              name, off = line.rsplit("@", 1)
              path = os.path.join("out", os.path.basename(base)[:-len("parts.txt")] + name)
              parts.append((int(off, 16), name, os.path.getsize(path)))
          parts.sort()
          print(parts)
          for i, (off, name, size) in enumerate(parts):
              assert size > 0, f"{name} is empty"
              if i + 1 < len(parts):
                  nxt = parts[i + 1][0]
                  assert off + size <= nxt, (
                      f"{name} is {size} bytes at {off:#x} and runs into "
                      f"{parts[i + 1][1]} at {nxt:#x}")
          EOF

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.slug }}
          path: out/*

  # Attaching happens once, after every board has built.
  #
  # Not in the matrix: two jobs calling action-gh-release for the same tag
  # race to create the release, and the loser can either fail or produce a
  # second, draft release next to the first. Collecting the artifacts and
  # attaching them in one step also means a release is never half-populated
  # while a board is still compiling.
  release:
    needs: [build, build-esp32]
    # `!cancelled()` rather than the default "all needs succeeded".
    #
    # The matrix already says a board's failure must not cancel the others,
    # and the staging side is per-board — but `needs: build` quietly undid
    # that: one failed board failed the whole job, and the release never ran.
    # A release carrying two of three boards is worth having, and which board
    # is missing is visible in the run. The empty-output guard below is what
    # stops this creating a release with nothing in it.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect every board's artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: firmware-*
          merge-multiple: true
          path: out

      - name: Refuse to publish an empty release
        # Reachable now that this job runs even when a build failed. Without
        # it, a release where every board failed would be created, published
        # and empty — which reads as "this version has no firmware" rather
        # than as "the build broke".
        run: |
          ls -la out/
          count=$(find out -type f | wc -l)
          [ "$count" -gt 0 ] || {
            echo "::error::every board failed to build — nothing to attach"
            exit 1
          }
          echo "attaching ${count} file(s)"

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # A tag push creates the release as a draft, so a bad build can be
          # discarded before anyone flashes it. When the run was triggered BY
          # a release, that release already exists and is published — forcing
          # draft here would un-publish it.
          draft: ${{ github.event_name != 'release' }}
          files: out/*
