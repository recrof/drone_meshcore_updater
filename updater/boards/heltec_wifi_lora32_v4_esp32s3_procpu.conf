# Kconfig for the Heltec WiFi LoRa 32 V4, applied on top of prj.conf.
#
# The same SoC and the same radio stack as the XIAO ESP32S3, so this is that
# board's fragment (boards/xiao_esp32s3_esp32s3_procpu.conf, which carries the
# reasoning for each block) with three differences:
#
#   * **PSRAM is 2 MB quad**, in-package on the ESP32-S3R2, not the XIAO
#     module's 8 MB octal. Selecting octal mode on a quad part does not fail
#     the build; it fails PSRAM init at boot.
#   * **The battery is measured** - the board has a JST battery connector and
#     a divider on GPIO1, so the voltage-divider sensor is enabled.
#   * **The flash size is stated.** Kconfig.esptool's choice defaults to 2 MB
#     whatever the devicetree says, and that value goes into the image header.
#     Set here and in sysbuild/mcuboot_heltec_wifi_lora32_v4.conf, so both
#     images describe the same 16 MB part.
#   * The advertised name.

CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

CONFIG_HEAP_MEM_POOL_SIZE=65536

# ---- WiFi, for the ElegantOTA transport (as on the XIAO ESP32S3) -----------
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_HTTP_CLIENT=y
CONFIG_DNS_RESOLVER=n

# ---- PSRAM: ESP32-S3R2, 2 MB quad -------------------------------------------
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_QUAD=y
CONFIG_ESP_SPIRAM_SIZE=2097152
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# ---- Battery ----------------------------------------------------------------
# voltage-divider on ADC1_CH0, see the board's vbatt node.
CONFIG_SENSOR=y

# ---- Advertised name --------------------------------------------------------
CONFIG_BT_DEVICE_NAME="Heltec V4 Updater"

# ---- Status display (OLED SSD1306 128x64 on I2C) ------------------------------
CONFIG_UPDATER_DISPLAY=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# The 2 MB of PSRAM shares ext_dram_seg with the flash-mapped .rodata, and
# LVGL's fonts push .rodata past the point where the default 1 MB SPIRAM heap
# still fits (overflow by ~23 KB). The heap only serves the WiFi driver here.
CONFIG_ESP_SPIRAM_HEAP_SIZE=786432
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y
