# Board Kconfig for xiao_nrf54lm20a_nrf54lm20a_cpuapp. Appended to prj.conf.

# ---- Advertised name -------------------------------------------------------
# Per board, overriding prj.conf's generic default (board .conf files are
# *appended*, so the last assignment wins).
#
# This reverses an earlier decision, and the reversal is deliberate. The old
# rule was "which board it is belongs on the wire as data, not in the name",
# written after a device advertising `XIAO nRF54 updater` turned out to be an
# nRF52840. That rule is still right for anything that *acts* on the board —
# the client asks mcumgr OS info (`osBoard()`) and `fsxCaps()`, never the
# advertised name, and nothing parses this string.
#
# What it got wrong is that the name is not for the client at all. It is what a
# human sees in a scan list next to four identical-looking XIAO boards, and
# "Drone MeshCore Updater" four times over is the least useful thing it could
# say there. The failure that produced the old rule was a *stale* name, not a
# specific one; naming each board correctly fixes that without giving anything
# a reason to parse it.
CONFIG_BT_DEVICE_NAME="Xiao nRF54 Updater"

# ---- Battery, and the board rail the PMIC sits on --------------------------
# This board carries an nPM1300 PMIC, already described in its devicetree, so
# it is the one board here that can report charge state honestly rather than
# inferring it from a voltage. The charger block is a Zephyr sensor; reaching
# it needs the bit-banged I2C the board wires it to, plus the MFD parent.
#
# CONFIG_I2C_GPIO is the one nothing implies — the bus is `gpio-i2c`, not a
# hardware TWI instance — and without it the driver binds to a controller that
# never appears, which is silent at build time and -ENODEV at run time.
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_I2C_GPIO=y
CONFIG_MFD=y
CONFIG_NPM13XX_CHARGER=y

# **CONFIG_REGULATOR is required, and the first version of this file said the
# opposite.** That was wrong, and the way it was wrong is worth keeping.
#
# The board declares `power_en` — a `regulator-fixed` on P1.12, marked
# `regulator-boot-on` — which gates the rail its I2C peripherals sit on.
# Without CONFIG_REGULATOR the fixed-regulator driver is not built at all, so
# nothing ever drives P1.12 and that rail stays down. The result on hardware:
#
#     <err> battery: battery sensor charger is not ready
#     <err> LSM6DSL: Failed to initialize chip
#
# Two devices, two different buses (the PMIC on the bit-banged pmic_i2c, the
# IMU on the hardware i2c30), both failing — which is the shape of a power
# problem rather than a bus one. The IMU had been failing that way since long
# before any battery code existed; nobody had asked why.
#
# It was originally left out because turning it on breaks the link:
#
#     error: '__device_dts_ord_164' undeclared here (not in a function)
#
# That is an **upstream defect, not a reason to avoid the symbol**, and
# treating a symptom as a constraint is what produced the first version.
# `NRF_USBHS_WRAPPER` is `default y` on `DT_HAS_NORDIC_NRF_USBHS_WRAPPER_ENABLED
# && REGULATOR`, and hard-references the SoC's VREGUSB regulator — but does not
# depend on *that* node being enabled, and it is `status = "disabled"` in
# `nrf54lm20_a_b.dtsi`. So any nRF54LM20A build that enables REGULATOR for an
# unrelated reason fails to link, whether or not it uses USB. Ordinal 164 is
# `/soc/peripheral@50000000/regulator@120000/regulator@1000`; nothing in the
# message says regulator, USB or VREGUSB.
#
# This board has no USB in use at all — the console is uart20 through the
# SAMD11 bridge, and both USB stacks are already off — so the wrapper is
# turned off rather than the regulator subsystem.
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
CONFIG_NRF_USBHS_WRAPPER=n
