# Kconfig for the XIAO ESP32S3 Sense.
#
# A variant inherits nothing: `xiao_esp32s3_esp32s3_procpu.conf` is not applied
# to `xiao_esp32s3/esp32s3/procpu/sense`, and neither is a board-name-only
# `xiao_esp32s3.conf` — both were tried and neither reached this target. Kconfig
# fragments cannot include one another either, so the value is repeated rather
# than referenced.
#
# **Keep this in step with xiao_esp32s3_esp32s3_procpu.conf**, which is where the
# reasoning lives. One integer is the whole of the duplication, and it stays
# that way only because every other line in that file turned out to be a no-op
# — if a second real setting appears there, it has to appear here too, and
# nothing will report it if it does not.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ---- Advertised name -------------------------------------------------------
# Per board, overriding prj.conf's generic default (board .conf files are
# *appended*, so the last assignment wins).
#
# This reverses an earlier decision, and the reversal is deliberate. The old
# rule was "which board it is belongs on the wire as data, not in the name",
# written after a device advertising `XIAO nRF54 updater` turned out to be an
# nRF52840. That rule is still right for anything that *acts* on the board —
# the client asks mcumgr OS info (`osBoard()`) and `fsxCaps()`, never the
# advertised name, and nothing parses this string.
#
# What it got wrong is that the name is not for the client at all. It is what a
# human sees in a scan list next to four identical-looking XIAO boards, and
# "Drone MeshCore Updater" four times over is the least useful thing it could
# say there. The failure that produced the old rule was a *stale* name, not a
# specific one; naming each board correctly fixes that without giving anything
# a reason to parse it.
#
# The `sense` variant inherits nothing — board files are matched by exact
# qualified target — so it needs its own copy or it silently falls back to the
# generic name. Same silicon, same updater, so the same name on purpose.
CONFIG_BT_DEVICE_NAME="Xiao ESP32-S3 Updater"
