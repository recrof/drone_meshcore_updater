# Board Kconfig for xiao_mg24. Appended to prj.conf, so the last assignment
# wins.
#
# The file name is the board's SHORT build string — the SoC qualifier is
# dropped when a board hosts exactly one SoC — which is why this is
# `xiao_mg24.conf` and not `xiao_mg24_efr32mg24b220f1536im48.conf`. The XIAO
# MG24 Sense is the same board target, so it needs no twin of this file (unlike
# xiao_ble_sense.conf and the ESP32-S3's, which are separate targets and
# inherit nothing).

# ---- Advertised name -------------------------------------------------------
# Per board, overriding prj.conf's generic default. It is what a human reads in
# a scan list next to several identical-looking XIAO boards; nothing parses it,
# and the web client identifies the device by mcumgr OS info (`osBoard()`) and
# `fsxCaps()` rather than by name.
CONFIG_BT_DEVICE_NAME="Xiao MG24 Updater"

# ---- Transmit power --------------------------------------------------------
#
# **On this board the radio power is decided here, at build time, and
# `ble_tx_power` in config.txt cannot change it.** That is a real difference
# from every other board and it is worth being explicit about, because a config
# key that silently does nothing is a failure this project has already had once
# — `ble_tx_power` was inert on *every* nRF board until
# BT_CTLR_TX_PWR_DYNAMIC_CONTROL was found missing.
#
# Why it cannot: src/ble_tx_power.c sends HCI VS opcode 0xFC0E, which is
# **Zephyr's** vendor-specific opcode. Zephyr's Silabs driver
# (drivers/bluetooth/hci/hci_silabs_efr32.c) implements no Zephyr VS commands
# at all — its config header defines SL_BLUETOOTH_NO_VS_HCI_COMMANDS unless
# CONFIG_BT_SILABS_EFR32_HCI_VS is set, and that option enables *Silicon Labs'*
# own VS set, which is a different command space. What the driver does instead
# is apply CONFIG_BT_CTLR_TX_PWR_ANTENNA exactly once, in slz_bt_open(), via
# BTLE_LL_SetMaxPower() — and it already warns when the ladder rounds the
# request down, which is the same courtesy ble_tx_power.c performs.
#
# ble_tx_power.c latches "unsupported" after the first refusal and says so once,
# naming the key, so this is a legible outcome rather than a silent one.
#
# **20 dBm, which is this part's ceiling and 12 dB above the nRF boards'.**
# efr32xg24.dtsi gives the radio `pa-max-power-dbm = <20>` and
# `radio-tx-high-power-supported`, so HAS_HW_EFR32_RADIO_TX_HIGH_POWER is set
# and BT_SILABS_EFR32_HIGH_POWER is selected automatically. The nRF ladder
# stops at +8. On a device whose entire purpose is reaching something out of
# range, taking the parity number would be leaving the board's best feature
# switched off.
#
# It was 8 (config.c's default for `ble_tx_power`, chosen so the first runs
# were comparable with the other boards) and that is what the first hardware
# report of weak signal was measured against. Verified applied, from a host
# scanner at a fixed distance:
#
#     requested   8 dBm   mean RSSI -44.1
#     requested  10 dBm   mean RSSI -40.5
#     requested  16 dBm   mean RSSI -37.9
#
# slz_set_tx_power() reads back what BTLE_LL_SetMaxPower() actually granted and
# LOG_WRNs when it differs from the request; at 10, 16 and 20 it says nothing,
# so the controller is granting all of them. **The boot log is the fact, this
# line is the request** — the same rule as ble_tx_power.c applies.
#
# **Regulatory note, which is the operator's call and not ours.** +20 dBm
# conducted, plus antenna gain, is at or over the 20 dBm EIRP that ETSI allows
# in 2.4 GHz, and Silabs offer CONFIG_BT_SILABS_EFR32_HIGH_POWER_AFH for
# exactly this ("the controller may be required to perform adaptive frequency
# hopping to comply with regulatory requirements"). It is deliberately NOT
# enabled here: it changes radio scheduling on the one board whose DFU
# throughput has never been measured, and stacking an untested radio change
# under an untested transfer makes the next diagnosis harder. Turn it on, or
# lower this number, according to where the device is flown.
CONFIG_BT_CTLR_TX_PWR_ANTENNA=20

# ---- External flash: move the bytes with the LDMA, not the CPU -------------
#
# Every byte of a firmware bundle crosses this bus twice — once being written
# by the upload, once being read back to checksum or to stream at a DFU target
# — so the SPI driver's transfer path is directly in the way of the two things
# this device exists to do.
#
# Without this, spi_silabs_eusart.c takes `spi_silabs_eusart_xfer_polling()`:
# one byte per loop iteration, spinning on EUSART_STATUS_TXC (transmit
# *complete* — the shift register fully drained) after each one before it loads
# the next. No pipelining, FIFOs unused.
#
# **This Kconfig is only half of it, and it is the half that does nothing on
# its own.** The driver's DMA channel initialiser is
# `COND_CODE_1(DT_INST_NODE_HAS_PROP(index, dmas), ...)`, so setting this
# without a `dmas` property on the node builds clean and silently keeps
# polling. The `dmas`/`dma-names` pair and `&dma0 { status = "okay"; }` are in
# boards/xiao_mg24.overlay. Ask the .config *and* the devicetree.
#
# **And it is only worth setting because common.dtsi's `cache-size` is 256.**
# Measured both ways on this board: at a 64-byte cache DMA made littlefs reads
# 26% *slower* (347 vs 467 KB/s), because two channel setups cost more than
# shifting 64 bytes saves. At 256 it is 830 vs 526. The full matrix, and the
# reason this is one decision spread over two files, is in the overlay.
#
# Not `default y` for us: the option is `default y if SPI_ASYNC`, and this
# firmware has no async SPI user, so nothing was ever going to turn it on.
CONFIG_SPI_SILABS_EUSART_DMA=y

# ---- Extended advertising: the only way this board can scan --------------
#
# **Without this, bt_le_scan_start() fails with -EINVAL for as long as the
# device is advertising, and this board cannot find a DFU target at all.**
#
# Measured, not deduced. The same firmware, same call, advertiser up vs down:
#
#   active 160/80 (the app's own params)  -> rc=-22
#   passive 160/80                        -> rc=-22
#   passive 0x30/0x30                     -> rc=-22
#   active 0x10/0x10                      -> rc=-22
#   ... after bt_le_adv_stop()
#   active 160/80                         -> OK, 258 reports
#   passive 160/80                        -> OK, 160 reports
#
# The -EINVAL is the controller rejecting the HCI command, surfaced by
# bt_hci_cmd_send_sync() mapping an HCI error status onto an errno — which is
# why it looks like bad scan parameters and is not. No parameter change of any
# kind helps; stopping the advertiser always does.
#
# Zephyr states the escape in bt_id_scan_random_addr_check() (host/id.c):
# advertiser and scanner have to share one address unless extended advertising
# is in use, in which case "advertiser and scanner are using a different random
# address" and the whole conflict is gone. Nordic's controller tolerates the
# legacy arrangement, which is why no other board here needs this and why the
# port looked complete without it.
#
# **This is the failure the drone case would have hit and nothing else would.**
# While a browser is connected the advertiser is down, so a survey started from
# the web UI works — which is exactly the configuration anyone would test in.
# An unattended auto-flash advertises and scans at once, and would have failed
# every time, in the field, reporting "no target found".
#
# Legacy discoverability is unaffected: Zephyr keeps using legacy PDUs on the
# primary channels for a legacy bt_le_adv_start(). Verified from a host scanner
# after the change — the board is still found by name, at 94 reports in 10 s.
CONFIG_BT_EXT_ADV=y
