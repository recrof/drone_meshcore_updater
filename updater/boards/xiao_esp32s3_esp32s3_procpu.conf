# Kconfig for the XIAO ESP32S3, applied on top of prj.conf.
#
# ---- How this file reaches the build ----------------------------------
#
# Two rules, and they are not the same rule:
#
#   * **Merge:** `boards/<target>.conf` is APPENDED to prj.conf, while
#     `boards/<target>.overlay` REPLACES app.overlay. Both are in
#     configuration_files.cmake — the KCONF lookup is unconditional, the DTS one
#     sits inside `if(NOT DEFINED DTC_OVERLAY_FILE)`. So this file is a set of
#     deltas and later assignments win; the overlay had to be self-contained.
#
#   * **Naming:** the file name must be the *exact* qualified board target, and
#     there is no inheritance in either direction. Measured, because reading
#     zephyr_build_string's MERGE handling suggests otherwise: a
#     `boards/xiao_esp32s3.conf` is not picked up by
#     `xiao_esp32s3/esp32s3/procpu/sense`, and neither is this file. Hence
#     xiao_esp32s3_esp32s3_procpu_sense.conf, which exists to carry one integer.
#
# Getting the first rule backwards produces a build that succeeds and is wrong;
# getting the second wrong produces a variant that silently runs on prj.conf's
# defaults.

# -------------------- The one setting this board actually needs -------------
#
# prj.conf's 16 KB is sized for a BLE-only Nordic build, where the SoftDevice
# Controller has its own memory and takes almost nothing from the system heap.
# Espressif's controller is a binary blob that allocates its buffers from the
# system heap at bt_enable(), and the WiFi stack will do the same again.
#
# Precautionary rather than measured: this has not yet been run on hardware, so
# 16 KB is not *known* to be too small — it is known to be sized for a different
# radio architecture. If RAM ever gets tight here, this is the first number to
# question, and the honest way to answer it is a boot log rather than this
# comment. 64 KB against 512 KB of DRAM is affordable either way.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# -------------------- Things deliberately NOT set here ----------------------
#
# Each of these was written, checked against the resulting .config, and removed
# again for being a no-op. Listed because the next person will reach for them
# too, and because a fragment full of settings that change nothing is a fragment
# nobody trusts.
#
#   CONFIG_SPI_NOR=n
#       prj.conf enables it for the nRF boards' external QSPI parts. There is no
#       jedec,spi-nor node on this board, so the driver is already off.
#
#   CONFIG_ESP32_BT_CTLR_LE_MAX_CONN=3
#       The Espressif controller's own connection limit, separate from the
#       host's BT_MAX_CONN. Its default is already 3, which is what prj.conf
#       asks the host for. Worth knowing it exists: raising BT_MAX_CONN without
#       raising this would give a host that believes in a slot the controller
#       will not open.
#
#   CONFIG_UART_CONSOLE / CONFIG_SERIAL / CONFIG_CONSOLE
#       Already y from prj.conf. The console here is `usb_serial` — the S3's
#       USB-Serial-JTAG peripheral, a fixed-function controller rather than the
#       USB device stack, so it is up before main() and needs no CDC ACM
#       configuration. This is the first board in this repo whose console
#       survives a hard fault without a host re-enumerating.
#
#   CONFIG_BT_CTLR_DATA_LENGTH_MAX (in prj.conf)
#       Silently inert here: it lives under `if BT_CTLR`, which is Zephyr's own
#       link layer, and this board uses an HCI driver to Espressif's controller.
#       DLE and 2M PHY still work — BT_ESP32 selects
#       BT_CTLR_DATA_LEN_UPDATE_SUPPORT and BT_CTLR_PHY_2M_SUPPORT, so the
#       BT_USER_*/BT_AUTO_* pairs in prj.conf apply unchanged. Left in prj.conf
#       because it is correct there; noted here because "the same line, silently
#       inert on the other part" is the shape of bug this port keeps finding.

# -------------------- One hazard, for when uploads are tested ---------------
#
# **The filesystem is on the flash the CPU executes from.** Both nRF boards put
# LittleFS on a separate QSPI part, so a flash write is a peripheral
# transaction. Here there is one XIP-mapped SPI part holding the bootloader,
# both slots and the filesystem, and writing it means the driver disables the
# instruction cache and runs from IRAM with interrupts off for the duration.
#
# That matters for this application specifically. fsx_stream calls fs_write()
# from the GATT write callback, and on the nRF52840 that path already produced a
# dropped link once — the diagnosis then rested on "a slow flash write cannot do
# this, because the SoftDevice Controller acks from interrupt context". **On
# this part that reasoning does not hold**: the controller is on-die and shares
# the stall. If uploads drop the link here, moving fs_write onto its own
# workqueue thread is the fix, and unlike on the nRF boards it would be
# addressing the actual cause rather than a stack size.

# ---- WiFi, for the ElegantOTA transport --------------------------------
#
# This board exists to reach MeshCore's ESP32 repeaters, which do not do BLE
# DFU at all — they raise a WiFi AP and take a multipart POST. Everything
# below is what that costs, and none of it is on any nRF build.
#
# The stack is deliberately narrow. We talk to exactly one peer: an open
# softAP at a known address, over one HTTP connection, in one direction. So
# there is no IPv6, no DNS, no TLS and no server.
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# The repeater's softAP runs a DHCP server (Arduino's WiFi.softAP does), so
# the address is leased rather than assumed. 192.168.4.1 is still where the
# server is — that is fixed by the AP, not by us.
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

# No net_config auto-init: it wants to bring an interface up at boot with a
# fixed address, and this interface only exists during a run.
CONFIG_NET_CONFIG_SETTINGS=n

CONFIG_HTTP_CLIENT=y
CONFIG_DNS_RESOLVER=n

# ---- external PSRAM ----------------------------------------------------
#
# The WROOM-1 N8R8 module carries 8 MB of octal PSRAM. The BLE host, the WiFi
# supplicant and the TCP/IP stack together do not fit comfortably in the
# 512 KB of internal SRAM, and this board has the part fitted, so use it.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_SIZE=8388608

# And *use* it for the things that made internal DRAM overflow.
#
# Enabling the stack without these overflows `dram0_0_seg` by ~7 KB: the WiFi
# driver's static buffers and the net buffer pools are large and they are BSS,
# so they land in internal DRAM whether or not PSRAM exists. These two move
# them out. Internal SRAM stays for what needs the speed — the BLE controller
# and the ISR paths.
CONFIG_ESP_WIFI_HEAP_SPIRAM=y
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y

# Left at what BLE alone needed. The WiFi driver adds its own requirement on
# top through HEAP_MEM_POOL_ADD_SIZE_ESP_WIFI, so raising this by hand would
# be double-counting — and it is internal DRAM, which is the scarce one.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ---- Advertised name -------------------------------------------------------
# Per board, overriding prj.conf's generic default (board .conf files are
# *appended*, so the last assignment wins).
#
# This reverses an earlier decision, and the reversal is deliberate. The old
# rule was "which board it is belongs on the wire as data, not in the name",
# written after a device advertising `XIAO nRF54 updater` turned out to be an
# nRF52840. That rule is still right for anything that *acts* on the board —
# the client asks mcumgr OS info (`osBoard()`) and `fsxCaps()`, never the
# advertised name, and nothing parses this string.
#
# What it got wrong is that the name is not for the client at all. It is what a
# human sees in a scan list next to four identical-looking XIAO boards, and
# "Drone MeshCore Updater" four times over is the least useful thing it could
# say there. The failure that produced the old rule was a *stale* name, not a
# specific one; naming each board correctly fixes that without giving anything
# a reason to parse it.
CONFIG_BT_DEVICE_NAME="Xiao ESP32-S3 Updater"
