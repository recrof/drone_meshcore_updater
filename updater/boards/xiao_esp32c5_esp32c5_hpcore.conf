# Kconfig for the XIAO ESP32C5, applied on top of prj.conf.
#
# Mostly the ESP32-S3's fragment, because it is the same application with the
# same two radios on the same vendor's silicon. Read
# boards/xiao_esp32s3_esp32s3_procpu.conf for the reasoning behind the WiFi and
# PSRAM block — it is not repeated here. **What IS here is every place the two
# parts differ**, because a line copied from the S3 that is silently inert on
# this one is precisely the failure mode this repo keeps hitting.

# -------------------- Heap, for a controller that allocates -----------------
#
# prj.conf's 16 KB is sized for a BLE-only Nordic build, where the SoftDevice
# Controller has its own memory. Espressif's controller allocates its buffers
# from the system heap at bt_enable(), and the WiFi stack does the same again.
# Same number as the S3, arrived at the same way, and now with the S3's
# hardware run behind it: 64 KB was enough there for BLE plus advertising.
#
# Note this board also gets CONFIG_HEAP_MEM_POOL_ADD_SIZE_BOARD=4096 from the
# vendored board Kconfig, which is *additive* — Zephyr takes the max of
# HEAP_MEM_POOL_SIZE and the sum of the ADD_SIZE_* contributions.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ---- WiFi and PSRAM are OFF on this board, and that is a finding ----------
#
# **This board ships BLE-only. The WiFi/ElegantOTA transport does not work on
# it yet.** Everything below is what was measured on hardware on 2026-08-30,
# written down because "why is WiFi off here when the S3 has it" is the first
# question anyone will ask, and because two separate defects are involved.
#
# What DOES work, confirmed on hardware: MCUboot validates the RSA signature
# and chainloads, LittleFS mounts on lfs_partition (1104 blocks, the 4416 KB
# the table allocates), config.txt seeds and loads, and the BLE controller
# comes up advertising as `Drone MeshCore Updater`. So the board port, the
# partition table and the whole BLE path are sound.
#
# ---- Why it does not work: one root cause, not two ------------------------
#
# The bisect, all three flashed and observed on hardware:
#
#     PSRAM on,  WiFi on   -> lockup after `Found 8MB PSRAM device`
#     PSRAM off, WiFi on   -> lockup after `flash io: dio`
#     PSRAM off, WiFi off  -> BOOTS, BLE up, advertising
#
# It dies before the kernel banner in both failing cases, so crash_record.c
# cannot see it — the fault is before the kernel exists to record it.
#
# **A first draft of this comment blamed the PSRAM/IROM shared base. That was
# wrong**, and it is the obvious wrong answer, so it is recorded rather than
# quietly deleted. zephyr.map shows `ext_dram_seg` and `irom0_0_seg` at the
# same `0x42000000`, which looks damning until you read the linker script,
# which puts them there on purpose: the C5 maps flash and PSRAM through one
# MMU window, and `memory.h` defines EXTRAM_START and IROM_SEG_ORG as the same
# address. Upstream does not move it either.
#
# What actually fits the evidence is that **the pinned tree predates upstream
# Zephyr's rework of the C5 flash/PSRAM mapping.** Upstream `main` adds a
# `.flash_rodata_dummy` section this tree does not have at all, commented
# "move drom0 after .text region to allow proper memory mapping", sized to the
# instruction reserved region. A DROM mapping that does not account for .text
# gets worse the larger .text is — and the only hard fact here is a size one:
# 637,656 bytes boots, 1,028,216 does not, with or without PSRAM.
#
# Hypothesis, not proof. **Bisect on image size before reading more code.**
#
# There is no newer Zephyr to move to: v3.4.0 is the newest NCS release and
# this project is on it. Bumping hal_espressif alone neither helps nor is safe
# — the gap is in zephyr/soc/espressif/esp32c5, and it is **not the blobs**,
# which are current and demonstrably fine, since BLE works on this board.
#
# ---- One thing found on the way that is worth keeping --------------------
#
# Turning PSRAM off alone does not link: the Espressif WiFi port calls
# `shared_multi_heap_*` unconditionally through
# hal/espressif/zephyr/port/include/esp_heap_adapter.h, and SHARED_MULTI_HEAP
# is normally selected by ESP_SPIRAM. So WiFi without PSRAM additionally needs
# CONFIG_SHARED_MULTI_HEAP=y, or it fails at link with a page of undefined
# references that name a heap and not a radio.
#
# ---- What to do when picking this up -------------------------------------
#
# Re-enable in this order, flashing and reading the console at each step:
#   1. CONFIG_SHARED_MULTI_HEAP=y + the WiFi block below, PSRAM still off.
#      If it boots, defect 2 was PSRAM-adjacent after all and only defect 1 is
#      real. If it locks up at `flash io: dio`, defect 2 stands.
#   2. Bisect defect 2 on image size before reading more code — build with
#      WiFi on but the net stack trimmed, and see whether the boundary tracks
#      IROM size rather than which subsystem is enabled.
#   3. Defect 1 is a linker-script bug in a west-managed tree. It cannot be
#      patched in zephyr/ (west update reverts it silently); it needs either an
#      upstream fix or an app-side linker fragment.
#
# The transport code itself is unaffected and stays compiled out by Kconfig —
# `dfu_transport_list()` simply reports BLE only, and because the web client
# *asks* the device what it supports rather than keeping a table, the UI
# already offers a `.bin` no flash button on this board and says why. That is
# the "asked, not tabulated" design paying for itself.
#
# CONFIG_WIFI is left at its default (n). It is not written as `=n` here
# because an explicit `=n` reads as "considered and rejected for this board",
# and the truth is "wanted, does not work yet".

# -------------------- Where this board is NOT the ESP32-S3 ------------------
#
# Three lines from the S3's fragment are deliberately absent. Each would have
# been accepted by the build and done nothing, which is the thing prj.conf's
# rule in CLAUDE.md exists for — **ask the generated .config, never the
# fragment, what is set.**
#
#   CONFIG_SPIRAM_MODE_OCT=y
#       **Silently dropped here.** soc/espressif/common/Kconfig.spiram:
#
#           config SPIRAM_MODE_OCT
#               bool "Octal Mode PSRAM"
#               depends on SOC_SERIES_ESP32S3
#
#       Octal PSRAM is an S3 feature. The C5's PSRAM is quad-mode, which is
#       the choice default, so omitting the line gets the right answer and
#       including it would have got the right answer for the wrong reason —
#       until someone read the fragment and believed it.
#
#   CONFIG_ESP_SPIRAM_SIZE=8388608
#       Redundant on both boards, and misleading on this one. The symbol
#       already defaults to the psram0 node's `size` property
#       (`default $(dt_node_int_prop_int,...)`), which the board .dts sets to
#       8 MB. Stating it here would put the module's size in two places, and
#       the devicetree is the one that also drives CONFIG_SPIRAM_TYPE.
#
#   CONFIG_SPI_NOR=n
#       Already off: no jedec,spi-nor node on this board either.
#
# And one that is different rather than absent:
#
#   CONFIG_STACK_SENTINEL (prj.conf)
#       Set here, and **it is the only stack net this board has** — same as the
#       ESP32-S3, though for a different reason, and the difference is worth
#       stating because the obvious inference is wrong.
#
#       RISC-V *can* do hardware stack protection: arch/riscv/Kconfig has
#       `select ARCH_HAS_STACK_PROTECTION`. But it hangs off RISCV_PMP, and
#       **RISCV_PMP is not set on this SoC** — verified in the generated
#       .config, not inferred:
#
#           # CONFIG_RISCV_PMP is not set
#           CONFIG_SOC_CPU_IDRAM_SPLIT_USING_PMP=y
#
#       The C5 spends its PMP entries on the IRAM/DRAM split at boot instead.
#       So CONFIG_HW_STACK_PROTECTION is unset here exactly as it is on the
#       Xtensa S3, and an overflow is silent corruption that surfaces later
#       somewhere innocent.
#
#       Two consequences, both already written up in CLAUDE.md for the S3 and
#       both applying unchanged here:
#         * Size a thread's stack for the *absence of a guard*, not for what
#           its own code appears to want. led.c keys its stack size on
#           CONFIG_HW_STACK_PROTECTION for this reason, so this board gets the
#           larger one without naming an architecture.
#         * **The thread named in a fault may be the one linked below the
#           thread that actually overflowed.** Read the link map before
#           believing the thread name.
#
#       (This entry replaces an earlier draft that claimed the opposite. The
#       claim came from reading arch/riscv/Kconfig and not the .config, which
#       is the exact mistake CLAUDE.md's first rule exists to prevent.)

# -------------------- One hazard, for when uploads are tested ---------------
#
# **The filesystem is on the flash the CPU executes from**, exactly as on the
# S3 and unlike both nRF boards. fsx_stream calls fs_write() from the GATT
# write callback, and here that means the driver disables the instruction cache
# and runs from IRAM with interrupts off for the duration — with the BLE
# controller on-die and sharing the stall. If uploads drop the link, moving
# fs_write onto its own workqueue thread is the fix. Watch for dropped
# connections rather than for write errors.

# ---- Advertised name -------------------------------------------------------
# Per board, overriding prj.conf's generic default (board .conf files are
# *appended*, so the last assignment wins).
#
# This reverses an earlier decision, and the reversal is deliberate. The old
# rule was "which board it is belongs on the wire as data, not in the name",
# written after a device advertising `XIAO nRF54 updater` turned out to be an
# nRF52840. That rule is still right for anything that *acts* on the board —
# the client asks mcumgr OS info (`osBoard()`) and `fsxCaps()`, never the
# advertised name, and nothing parses this string.
#
# What it got wrong is that the name is not for the client at all. It is what a
# human sees in a scan list next to four identical-looking XIAO boards, and
# "Drone MeshCore Updater" four times over is the least useful thing it could
# say there. The failure that produced the old rule was a *stale* name, not a
# specific one; naming each board correctly fixes that without giving anything
# a reason to parse it.
CONFIG_BT_DEVICE_NAME="Xiao ESP32-C5 Updater"
