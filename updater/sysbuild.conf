#
# Sysbuild image selection.
#
# `CONFIG_BOOTLOADER_MCUBOOT=y` in prj.conf is NOT enough and is silently
# ineffective on its own: under sysbuild the app image's Kconfig is written
# from the sysbuild configuration, so SB_CONFIG_BOOTLOADER_MCUBOOT=n forces
# CONFIG_BOOTLOADER_MCUBOOT=n into the image regardless of what prj.conf
# asked for. The symptom is quiet — the app links at 0x0 with
# FLASH_LOAD_OFFSET=0, boots fine, and simply never produces app_update.bin
# or dfu_application.zip. Check updater/build/updater/zephyr/.config, not
# prj.conf, when asking whether MCUboot is really on.
#
# The board's partition table was already MCUboot-shaped before this file
# existed: boot_partition (64K at 0), slot0/slot1 (449K each), so enabling
# this does not move the filesystem or the storage partition.
#
SB_CONFIG_BOOTLOADER_MCUBOOT=y
