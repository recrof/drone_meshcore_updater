# MCUboot Kconfig for xiao_esp32s3. Selected by updater/sysbuild/CMakeLists.txt.
#
# The signature type and the swap mode are NOT here — sysbuild's forced
# .config.sysbuild is merged after this file and would overwrite them. They are
# in sysbuild_xiao_esp32s3.conf, which also explains why this board signs RSA
# while the others sign ED25519.

# -------------------- Validate what is about to run --------------------
# MCUboot's own boot/zephyr/socs/esp32s3_procpu.conf sets
# CONFIG_BOOT_VALIDATE_SLOT0=n — faster boots, and no check that the image
# about to run is the one that was signed. It also means a half-written image
# from an interrupted swap is executed rather than rejected, which is the case
# this project is most likely to produce: the swap follows a wireless update to
# a device nobody can reach.
CONFIG_BOOT_VALIDATE_SLOT0=y

# -------------------- PSA, for RSA's SHA-256 and signature check ------------
# BOOT_SIGNATURE_TYPE_RSA selects BOOT_USE_PSA_CRYPTO and a set of PSA_WANT_*
# symbols, all of which `depend on PSA_CRYPTO` — and NCS leaves PSA_CRYPTO off
# for a bootloader image. Without this line every one of those selects has an
# unmet dependency and the build stops on the Kconfig warnings rather than on
# anything that names the cause.
#
# The provider is Zephyr's own mbedTLS, not Oberon: NCS only defaults
# `choice PSA_CRYPTO_PROVIDER` to PSA_CRYPTO_PROVIDER_CUSTOM
# `if SOC_FAMILY_NORDIC_NRF && ARM`. That is the whole reason RSA builds here
# and ED25519 does not.
CONFIG_PSA_CRYPTO=y

# -------------------- Working around an NCS bug --------------------
# boot/zephyr/main.c calls nrf_crypto_keys_housekeeping() unconditionally, but
# only *includes* the header that declares it under
# `#if CONFIG_MCUBOOT_NRF_CLEANUP_PERIPHERAL` — which is `depends on
# SOC_FAMILY_NORDIC_NRF`. So on any non-Nordic SoC the build ends with
#
#     main.c:972:5: error: implicit declaration of function
#                          'nrf_crypto_keys_housekeeping'
#
# and there is no Kconfig that fixes it: forcing MCUBOOT_NRF_CLEANUP_PERIPHERAL
# on is both dropped (unmet dependency) and wrong, since it would call Nordic
# register code.
#
# What the header itself does, when key storage is not in use, is
#
#     #define nrf_crypto_keys_housekeeping() do {} while (0)
#
# so defining the macro away restores exactly the intended behaviour. Done as a
# -D rather than `-include nrf_cleanup.h` so it carries no path and cannot be
# broken by an include-order change.
#
# **Remove this when NCS fixes it.** If the header ever starts being included
# here, its own #define collides with this one. That is a loud failure rather
# than a quiet one, which is the reason to prefer this shape over patching the
# tree — a patch under bootloader/ would be silently reverted by `west update`.
CONFIG_COMPILER_OPT="-Dnrf_crypto_keys_housekeeping()="

# -------------------- A heap for the signature check --------------------
# Without these two lines this board builds cleanly, flashes correctly, and
# then does not boot: no console output, no Bluetooth, nothing. It cost a
# full debugging session, so here is the whole chain.
#
# MCUboot's Kconfig attaches the mbedTLS heap to the *signature type*, and it
# only does so for one of them (boot/zephyr/Kconfig):
#
#     config BOOT_ED25519_PSA
#         select MBEDTLS_ENABLE_HEAP if !PSA_CORE_LITE
#
# That is the only `select MBEDTLS_ENABLE_HEAP` in the file.
# BOOT_SIGNATURE_TYPE_RSA selects BOOT_USE_PSA_CRYPTO and the PSA_WANT_*
# symbols and stops there — so PSA is asked to verify an RSA-2048 signature
# with no allocator configured at all.
#
# It is worse than a plain default, because MCUboot's own
# boot/zephyr/socs/esp32s3_procpu.conf closes the other door too:
#
#     CONFIG_HEAP_MEM_POOL_SIZE=4096
#     CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
#
# That file was written for CONFIG_BOOT_SIGNATURE_TYPE_NONE and
# CONFIG_BOOT_VALIDATE_SLOT0=n — a bootloader that does no crypto and
# therefore needs no heap. This build overrides both of those (RSA above,
# VALIDATE_SLOT0 at the top of this file) without the fragment knowing, so
# every allocation in the verify path returns NULL, the signature check fails,
# and MCUboot correctly declines to boot an image it could not validate.
#
# **The silence is the expensive part, and it is also configured there:**
# MCUBOOT_LOG_LEVEL_OFF, CONSOLE=n, SERIAL=n. A bootloader that rejects the
# image and cannot say so is indistinguishable from a dead chip. Diagnosis
# came from diffing this image's .config against the nRF54L's, in one command —
# see the "diff the two .config files" rule in CLAUDE.md. The full write-up,
# including why you cannot simply watch this board boot, is Trap 6 in
# notes/traps.md.
#
# 8192 rather than MCUboot's `default 2048 if BOOT_USE_PSA_CRYPTO`: that
# default sits under `if MBEDTLS_ENABLE_HEAP` and was chosen for ED25519,
# whose key and intermediates are 32-byte quantities. RSA-2048 works in
# 256-byte MPIs and imports a public key through ASN.1. The S3 has 512 KB of
# SRAM and this memory is reclaimed the moment the application starts, so the
# headroom costs nothing worth counting.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
