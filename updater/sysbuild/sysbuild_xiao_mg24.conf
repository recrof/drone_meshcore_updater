# Sysbuild overrides for xiao_mg24. Selected by updater/sysbuild/CMakeLists.txt.
#
# These have to be at the *sysbuild* level rather than in
# mcuboot_xiao_mg24.conf. Sysbuild writes the signature type into each image's
# forced `.config.sysbuild`, which is merged last — so an image-level fragment
# setting it is overwritten without a word. That mistake has been made here
# once already, on the ESP32-S3, and it appears to do nothing at all.

# -------------------- RSA, because ED25519 cannot be built here -------------
#
# NCS's sysbuild picks a signature type from the SoC and has no opinion about
# this one (nrf/sysbuild/Kconfig.mcuboot):
#
#     default BOOT_SIGNATURE_TYPE_ED25519 if SOC_SERIES_NRF54L || NRF54H || NRF71
#     default BOOT_SIGNATURE_TYPE_ECDSA_P256 if (SOC_NRF52840 || SOC_SERIES_NRF91) ...
#
# No branch matches an EFR32, so the choice would fall through to upstream's
# first entry rather than to anything chosen for this part. A signature type
# arrived at by list order is not a decision, so one is made here.
#
# It cannot be ED25519 or ECDSA-P256, and the reason looks like a configuration
# problem and is not. NCS's MCUboot fork binds both to Nordic crypto with
# `select` lines that carry no condition (bootloader/mcuboot/boot/zephyr/Kconfig):
#
#     config BOOT_SIGNATURE_TYPE_ED25519
#         select BOOT_USE_MBEDTLS_INCLUDES
#     config BOOT_SIGNATURE_TYPE_ECDSA_P256
#         select BOOT_USE_MBEDTLS_INCLUDES
#
#     config BOOT_USE_MBEDTLS_INCLUDES
#         select NRF_SECURITY      # "The includes comes from Oberon PSA crypto"
#
# `select` ignores `depends on`, so NRF_SECURITY comes out y despite its own
# `depends on SOC_FAMILY_NORDIC_NRF && ARM`, and nrf_security's CMakeLists then
# unconditionally adds nrfxlib's crypto directory. **On the Espressif boards
# that stops the build at configure time** with "GCC_M_CPU must be set", which
# is at least unmissable. This part is Cortex-M33, so GCC_M_CPU *is* set and
# that particular guard does not fire — the build would go further and link
# against libraries compiled for Nordic cores. A failure that gets further is
# not a better failure.
#
# RSA is the one signature type in this fork that touches neither Nordic crypto
# nor tinycrypt — `select BOOT_USE_PSA_CRYPTO` and PSA_WANT_* and nothing else
# — and on a non-Nordic SoC `choice PSA_CRYPTO_PROVIDER` falls through to
# Zephyr's own PSA_CRYPTO_PROVIDER_MBEDTLS, so nrfxlib is never reached for.
#
# It costs a larger bootloader, which is why mg24_partitions.dtsi grows
# boot_partition from 48K to 64K, and it obliges mcuboot_xiao_mg24.conf to
# configure the mbedTLS allocator by hand — **RSA is the one signature type
# MCUboot's Kconfig does not give a heap.** See Trap 6.
#
# BOOT_SIGNATURE_TYPE_NONE is a trap in the other direction: it selects *two*
# crypto backends at once on anything that is not an nRF54L
# (`select BOOT_USE_TINYCRYPT if !SOC_SERIES_NRF54L` plus
# `select BOOT_USE_PSA_CRYPTO`) and compiles until mcuboot_config.h reaches
# `#error "One crypto library implementation allowed at a time."`.
#
# That makes four boards and three signature types — ED25519 on the nRF54L,
# ECDSA-P256 on the nRF52840, RSA-2048 on both Espressif parts and now here.
# All four use MCUboot's checked-in debug key, which the build warns about on
# every run: **anyone can sign for any of them until those are replaced.**
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y

# -------------------- Swap mode is not stated, deliberately -----------------
#
# NCS's sysbuild already defaults `choice MCUBOOT_MODE` to
# MCUBOOT_MODE_SWAP_USING_MOVE with no SoC condition, and nothing in the Silabs
# path overrides it — unlike the Espressif boards, where MCUboot's own
# socs/esp32s3_procpu.conf sets BOOT_UPGRADE_ONLY=y and would have silently
# deleted this project's wireless safety net (src/selfconfirm.c needs a
# previous image to revert *to*).
#
# Checked in build_xiao_mg24/mcuboot/zephyr/.config rather than assumed — a
# Kconfig line in a .conf is a request, not a fact.
