# Sysbuild overrides for xiao_esp32s3. Selected by sysbuild/CMakeLists.txt.
#
# These have to be at the *sysbuild* level rather than in
# mcuboot_xiao_esp32s3.conf. Sysbuild writes the swap mode and the signature
# type into each image's forced `.config.sysbuild`, which is merged last — so
# an image-level fragment setting either of them is overwritten without a word.
# Both settings below were first written in the wrong file and appeared to do
# nothing.

# -------------------- RSA, because ED25519 cannot be built here -------------
#
# This is the only board in the repo whose signature type is stated rather than
# inherited. The nRF boards take NCS's default and it differs between them —
# ED25519 on the nRF54L, ECDSA-P256 on the nRF52840 — which is fine, because
# each is what Nordic tests on that part and what those boards have been running
# on hardware. This board's default is BOOT_SIGNATURE_TYPE_NONE (the board's own
# Kconfig.sysbuild) and that is not acceptable, so a choice has to be made here.
#
# It cannot be ED25519, and the reason is worth writing down because it looks
# like a configuration problem and is not.
#
# NCS's MCUboot fork binds ED25519 and ECDSA to Nordic crypto with `select`
# lines that carry no condition (bootloader/mcuboot/boot/zephyr/Kconfig):
#
#     config BOOT_SIGNATURE_TYPE_ED25519
#         select BOOT_USE_MBEDTLS_INCLUDES
#     config BOOT_SIGNATURE_TYPE_ECDSA_P256
#         select BOOT_USE_MBEDTLS_INCLUDES
#
#     config BOOT_USE_MBEDTLS_INCLUDES
#         select NRF_SECURITY      # "The includes comes from Oberon PSA crypto"
#
# `select` ignores `depends on`, so NRF_SECURITY comes out y on an Xtensa part
# despite its own `depends on SOC_FAMILY_NORDIC_NRF && ARM`. nrf_security's
# CMakeLists then unconditionally adds nrfxlib's crypto directory, and nrfxlib
# asks for GCC_M_CPU — an ARM notion — and stops the build at configure time:
#
#     Assertion failed: GCC_M_CPU must be set to find correct lib.
#
# There is no Kconfig route around that, because the problem is a `select`.
#
# BOOT_SIGNATURE_TYPE_NONE is a trap in the other direction and was tried
# first. It selects **two** crypto backends at once on anything that is not an
# nRF54L —
#
#     select BOOT_USE_TINYCRYPT if !SOC_SERIES_NRF54L
#     select BOOT_USE_PSA_CRYPTO
#
# — and NCS's sysbuild adds `set_config_bool(mcuboot CONFIG_PSA_CRYPTO y)` for
# NONE with no SoC condition on top. The result compiles until
# mcuboot_config.h reaches `#error "One crypto library implementation allowed
# at a time."`. Nordic never hits it: their non-54L parts sign RSA or ECDSA.
#
# RSA is the one signature type in this fork that touches neither Nordic
# crypto nor tinycrypt — `select BOOT_USE_PSA_CRYPTO` and PSA_WANT_* and
# nothing else — and on a non-Nordic SoC `choice PSA_CRYPTO_PROVIDER` falls
# through to Zephyr's own PSA_CRYPTO_PROVIDER_MBEDTLS, so nrfxlib is never
# reached for. It costs a larger bootloader than ED25519 would, and one thing
# that is not obvious and cost a debugging session: **RSA is the one signature
# type MCUboot's Kconfig does not give a heap.** `select MBEDTLS_ENABLE_HEAP`
# hangs off BOOT_ED25519_PSA and nothing else, so choosing RSA here obliges
# mcuboot_xiao_esp32s3.conf to configure the allocator by hand. Trap 6 in
# notes/traps.md is what that looks like when you forget.
#
# So all three boards do check a signature — ED25519, ECDSA-P256 and RSA-2048
# respectively. All three use MCUboot's checked-in debug key, which the build
# warns about on every run: anyone can sign for any of them until those are
# replaced, and there are now three keys to replace rather than one.
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y

# -------------------- Swap with revert, not overwrite --------------------
#
# MCUboot's own boot/zephyr/socs/esp32s3_procpu.conf sets
# CONFIG_BOOT_UPGRADE_ONLY=y — overwrite the primary slot and keep no way back.
#
# **That would silently delete this project's wireless safety net.**
# src/selfconfirm.c exists because the updater's only link is the thing being
# updated: a new image is uploaded, marked *test*, and booted, and if it cannot
# bring Bluetooth up it is never confirmed and MCUboot restores the previous one
# at the next reset. Overwrite-only keeps no previous one. A bad OTA would be
# final, on a device that is on a mast precisely because nobody can reach it.
#
# Nothing would have reported the loss. The upload succeeds, img_mgmt accepts
# the test flag, and the revert simply never happens — a feature observable only
# on the one occasion it matters.
#
# Zephyr's own sysbuild already defaults ESP32 to this
# (`default MCUBOOT_MODE_SWAP_USING_MOVE if SOC_FAMILY_ESPRESSIF_ESP32`); NCS's
# fork of the choice overrides it, and the board fragment overrides that. Stated
# explicitly so that neither upstream's opinion is what decides it.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
