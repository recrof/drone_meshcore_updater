# MCUboot Kconfig for xiao_ble. Selected by updater/sysbuild/CMakeLists.txt.
#
# This board's console is a USB CDC ACM port, and the board's own defconfig is
# explicit that the USB stack is only brought up outside the bootloader
# (`USB_DEVICE_STACK_NEXT default y if !MCUBOOT`). So MCUboot inherits
# `zephyr,console = &board_cdc_acm_uart` pointing at a device that its own
# build never instantiates, and the link fails on an undefined
# `__device_dts_ord_NNN` from uart_console.c.
#
# Turning the console off is the honest answer rather than a workaround: there
# is no wire to print to. The bootloader is silent here, and MCUboot's decisions
# are visible in the application's log anyway (which slot booted, and whether
# the image was confirmed).
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
