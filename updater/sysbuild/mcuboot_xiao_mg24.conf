# MCUboot Kconfig for xiao_mg24. Selected by updater/sysbuild/CMakeLists.txt.
#
# The signature type and the swap mode are NOT here — sysbuild's forced
# .config.sysbuild is merged after this file and would overwrite them. They are
# in sysbuild_xiao_mg24.conf, which also explains why this board signs RSA.
#
# **This board inherits nothing.** MCUboot ships per-SoC fragments under
# boot/zephyr/socs/ for the Nordic and Espressif parts and none for Silabs, so
# there is no vendor file quietly turning the console off (Trap 6) — and none
# supplying defaults either. Everything this bootloader needs beyond MCUboot's
# own defaults is in this file, which is the good side of the same coin.

# -------------------- Validate what is about to run --------------------
# MCUboot's own default, stated rather than inherited. It is what stops a
# half-written image from an interrupted swap being executed instead of
# rejected — the case this project is most likely to produce, since the swap
# follows a wireless update to a device nobody can reach. The Espressif SoC
# fragment turns this *off*; nothing does so here, and writing it down is what
# keeps a future vendor fragment from changing the answer silently.
CONFIG_BOOT_VALIDATE_SLOT0=y

# -------------------- PSA, for RSA's SHA-256 and signature check ------------
# BOOT_SIGNATURE_TYPE_RSA selects BOOT_USE_PSA_CRYPTO and a set of PSA_WANT_*
# symbols, all of which `depend on PSA_CRYPTO` — and NCS leaves PSA_CRYPTO off
# for a bootloader image. Without this line every one of those selects has an
# unmet dependency and the build stops on Kconfig warnings that do not name the
# cause.
#
# The provider is Zephyr's own mbedTLS, not Oberon: NCS only defaults
# `choice PSA_CRYPTO_PROVIDER` to PSA_CRYPTO_PROVIDER_CUSTOM
# `if SOC_FAMILY_NORDIC_NRF && ARM`. This part is ARM but not Nordic, so it
# falls through — which is the whole reason RSA builds here and ED25519 does
# not.
CONFIG_PSA_CRYPTO=y

# -------------------- Working around an NCS bug --------------------
# boot/zephyr/main.c calls nrf_crypto_keys_housekeeping() unconditionally, but
# only *includes* the header that declares it under
# `#if CONFIG_MCUBOOT_NRF_CLEANUP_PERIPHERAL` — which is `depends on
# SOC_FAMILY_NORDIC_NRF`. So on any non-Nordic SoC the build ends with
#
#     main.c:972:5: error: implicit declaration of function
#                          'nrf_crypto_keys_housekeeping'
#
# Same fix as both Espressif boards, and for exactly the same reason: this is
# an NCS-vs-non-Nordic-SoC problem, not an Espressif one. When the header is
# not included, it defines the call away itself:
#
#     #define nrf_crypto_keys_housekeeping() do {} while (0)
#
# so defining the macro here restores the intended behaviour. Done as a -D
# rather than `-include nrf_cleanup.h` so it carries no path.
#
# **Remove this when NCS fixes it** — if the header ever does get included, its
# own #define collides with this one, which is a loud failure rather than a
# quiet one. That is the reason to prefer this over patching bootloader/, which
# `west update` would silently revert.
CONFIG_COMPILER_OPT="-Dnrf_crypto_keys_housekeeping()="

# -------------------- A heap for the signature check --------------------
# MCUboot's Kconfig attaches the mbedTLS heap to the *signature type*, and only
# to one of them (boot/zephyr/Kconfig):
#
#     config BOOT_ED25519_PSA
#         select MBEDTLS_ENABLE_HEAP if !PSA_CORE_LITE
#
# That is the only `select MBEDTLS_ENABLE_HEAP` in the file.
# BOOT_SIGNATURE_TYPE_RSA selects BOOT_USE_PSA_CRYPTO and the PSA_WANT_*
# symbols and stops there — so PSA is asked to verify an RSA-2048 signature
# with no allocator at all, every allocation in the verify path returns NULL,
# the check fails, and MCUboot correctly declines to boot an image it could not
# validate. Trap 6 in notes/traps.md is what that looked like on the ESP32-S3,
# where the same SoC fragment had also turned the console off so the correct
# refusal was indistinguishable from a dead chip.
#
# **It should be louder here**, because nothing silences this board: it has a
# real UART console on the SAMD11 bridge and no vendor fragment touching
# MCUBOOT_LOG_LEVEL. That is a reason to expect a legible failure, not a reason
# to leave the heap out.
#
# 8192 rather than MCUboot's `default 2048 if BOOT_USE_PSA_CRYPTO`: that
# default sits under `if MBEDTLS_ENABLE_HEAP` and was chosen for ED25519, whose
# key and intermediates are 32-byte quantities. RSA-2048 works in 256-byte MPIs
# and imports a public key through ASN.1. This part has 256 KB of SRAM and the
# memory is reclaimed the moment the application starts.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
