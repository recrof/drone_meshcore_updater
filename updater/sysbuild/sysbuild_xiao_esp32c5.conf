# Sysbuild overrides for xiao_esp32c5. Selected by sysbuild/CMakeLists.txt.
#
# Both settings have to be at the *sysbuild* level rather than in
# mcuboot_xiao_esp32c5.conf: sysbuild writes the swap mode and the signature
# type into each image's forced `.config.sysbuild`, which is merged last, so an
# image-level fragment setting either is overwritten without a word.
#
# This file is the ESP32-S3's with the board name changed, and the reasoning is
# identical — read sysbuild_xiao_esp32s3.conf for the full derivation. The
# short version of each:

# -------------------- RSA, because ED25519 cannot be built here -------------
#
# The board's own Kconfig.sysbuild defaults to BOOT_SIGNATURE_TYPE_NONE, which
# is not acceptable for a device that takes wireless updates, so a choice has
# to be made here.
#
# It cannot be ED25519 or ECDSA: NCS's MCUboot fork hangs an unconditional
# `select NRF_SECURITY` off both of them, `select` ignores `depends on`, and
# nrfxlib then asks for GCC_M_CPU — an ARM notion — and stops the build at
# configure time. That fires on RISC-V for the same reason it fires on Xtensa;
# nothing about it was S3-specific.
#
# NONE is a trap in the other direction: it selects BOOT_USE_TINYCRYPT *and*
# BOOT_USE_PSA_CRYPTO on anything that is not an nRF54L, and ends at
# mcuboot_config.h's `#error "One crypto library implementation allowed at a
# time."`
#
# RSA touches neither Nordic crypto nor tinycrypt, and on a non-Nordic SoC
# `choice PSA_CRYPTO_PROVIDER` falls through to Zephyr's own mbedTLS provider.
# It obliges mcuboot_xiao_esp32c5.conf to configure an allocator by hand,
# because **RSA is the one signature type MCUboot's Kconfig does not give a
# heap** — Trap 6.
#
# That makes four boards and four keys, all still MCUboot's checked-in debug
# key. Anyone can sign for any of them until those are replaced.
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y

# -------------------- Swap with revert, not overwrite -----------------------
#
# src/selfconfirm.c is this project's only wireless safety net: a new image is
# booted in *test* mode and MCUboot restores the previous one at the next reset
# if it never confirms. Overwrite-only keeps no previous one, so a bad OTA
# would be final on a device that is on a mast precisely because nobody can
# reach it — and nothing would report the loss, because the upload succeeds and
# the revert simply never happens.
#
# Stated explicitly rather than inherited so that neither upstream's opinion
# nor a vendor SoC fragment is what decides it.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
