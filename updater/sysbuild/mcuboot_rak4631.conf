# MCUboot Kconfig for rak4631. Selected by updater/sysbuild/CMakeLists.txt.
#
# The application's console is a USB CDC ACM port (boards/rak4631.overlay),
# and the bootloader never brings the USB stack up — so MCUboot would inherit
# `zephyr,console = &board_cdc_acm_uart` pointing at a device its own build
# does not instantiate, and the link fails on an undefined
# `__device_dts_ord_NNN` from uart_console.c. The same thing happens on the
# XIAO nRF52840 for the same reason.
#
# Turning the console off is the honest answer rather than a workaround: there
# is no wire to print to at that point. MCUboot's decisions are visible in the
# application's log anyway — which slot booted, and whether the image was
# confirmed.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
