# MCUboot Kconfig for xiao_esp32c5. Selected by updater/sysbuild/CMakeLists.txt.
#
# The signature type and the swap mode are NOT here — sysbuild's forced
# .config.sysbuild is merged after this file and would overwrite them. They are
# in sysbuild_xiao_esp32c5.conf.
#
# ---- THIS BOARD INHERITS NO ESPRESSIF DEFAULTS AT ALL ---------------------
#
# Zephyr applies `<app>/socs/<soc>.conf` to any image whose SoC matches, and
# MCUboot ships one per Espressif part it supports:
#
#     bootloader/mcuboot/boot/zephyr/socs/
#         esp32_procpu.conf  esp32c2.conf  esp32c3.conf
#         esp32c6.conf       esp32s2.conf  esp32s3_procpu.conf
#
# **There is no esp32c5.conf, and nothing anywhere in that tree mentions the
# C5.** So unlike the ESP32-S3, this bootloader starts from Zephyr's plain
# defaults.
#
# That cuts both ways, and both are worth knowing:
#
#   * **The good half.** Trap 6's poison is absent. The S3's fragment sets
#     BOOT_VALIDATE_SLOT0=n, BOOT_UPGRADE_ONLY=y, and CONSOLE/SERIAL/LOG all
#     off — so an S3 bootloader that refuses an image cannot say so, and is
#     indistinguishable from a dead chip. None of that reaches this board, so
#     it is the first Espressif bootloader in this repo that can talk.
#
#   * **The bad half.** The useful settings are missing too, and one of them
#     is not optional — see BOOT_MAX_IMG_SECTORS below.
#
# When MCUboot upstream adds an esp32c5.conf, re-derive this file against it
# rather than assuming it changed nothing: it will almost certainly arrive
# carrying the same three silencing lines, and it is merged *before* this one.

# -------------------- The setting that is not optional ---------------------
#
# MCUboot tracks each slot as a bitmap of sectors and BOOT_MAX_IMG_SECTORS is
# how many it can hold. **The default is 128.** A 1792 KB slot on a part with
# 4096-byte sectors is 448 of them, so the default covers 512 KB of a 1792 KB
# slot — and every Espressif socs/*.conf raises it to 512 for exactly this
# reason. This board gets no such file, so the line lives here.
#
# 512 rather than 448: it is what every other Espressif fragment uses, it costs
# 64 bytes of bitmap, and it means resizing a slot within this 8 MB part does
# not silently outgrow it.
CONFIG_BOOT_MAX_IMG_SECTORS=512

# -------------------- Validate what is about to run ------------------------
#
# Not inherited from anywhere here — stated because it is right, not because
# something else set it wrong. Without it a half-written image from an
# interrupted swap is executed rather than rejected, which is the case this
# project is most likely to produce: the swap follows a wireless update to a
# device nobody can reach.
CONFIG_BOOT_VALIDATE_SLOT0=y

# -------------------- PSA, for RSA's SHA-256 and signature check -----------
#
# BOOT_SIGNATURE_TYPE_RSA selects BOOT_USE_PSA_CRYPTO and a set of PSA_WANT_*
# symbols, all of which `depend on PSA_CRYPTO` — and NCS leaves PSA_CRYPTO off
# for a bootloader image. Without this line every one of those selects has an
# unmet dependency and the build stops on Kconfig warnings rather than on
# anything that names the cause.
#
# The provider is Zephyr's own mbedTLS, not Oberon: NCS only defaults
# `choice PSA_CRYPTO_PROVIDER` to PSA_CRYPTO_PROVIDER_CUSTOM
# `if SOC_FAMILY_NORDIC_NRF && ARM`. That is the whole reason RSA builds here.
CONFIG_PSA_CRYPTO=y

# -------------------- A heap for the signature check -----------------------
#
# **Trap 6, and it applies to this board for the signature-type half of the
# reason even though the poisoned SoC fragment is absent.** MCUboot's Kconfig
# attaches the mbedTLS heap to the signature type, and only to one of them
# (boot/zephyr/Kconfig):
#
#     config BOOT_ED25519_PSA
#         select MBEDTLS_ENABLE_HEAP if !PSA_CORE_LITE
#
# That is the only `select MBEDTLS_ENABLE_HEAP` in the file. RSA selects
# BOOT_USE_PSA_CRYPTO and the PSA_WANT_* symbols and stops — so PSA is asked to
# verify an RSA-2048 signature with no allocator configured.
#
# On the S3 this produced a board that built, flashed, hash-verified clean and
# then did nothing whatsoever, because that board's SoC fragment had also
# turned the console off. **Here it would fail loudly**, since nothing silenced
# this bootloader — but the fix is the same and there is no reason to find out.
#
# 8192 rather than MCUboot's `default 2048 if BOOT_USE_PSA_CRYPTO`: that
# default sits under `if MBEDTLS_ENABLE_HEAP` and was chosen for ED25519, whose
# key and intermediates are 32-byte quantities. RSA-2048 works in 256-byte MPIs
# and imports a public key through ASN.1. This memory is reclaimed the moment
# the application starts.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192

# -------------------- Working around an NCS bug ----------------------------
#
# boot/zephyr/main.c calls nrf_crypto_keys_housekeeping() unconditionally but
# only *includes* the header that declares it under
# `#if CONFIG_MCUBOOT_NRF_CLEANUP_PERIPHERAL`, which is
# `depends on SOC_FAMILY_NORDIC_NRF`. So on any non-Nordic SoC the build ends
# with an implicit-declaration error, and there is no Kconfig that fixes it:
# forcing the symbol on is both dropped and wrong.
#
# What the header does when key storage is not in use is
# `#define nrf_crypto_keys_housekeeping() do {} while (0)`, so defining the
# macro away restores exactly the intended behaviour. As a -D rather than an
# -include so it carries no path and cannot be broken by include order.
#
# **Remove this when NCS fixes it.** If the header ever starts being included
# here, its own #define collides with this one — a loud failure rather than a
# quiet one, which is why this shape is preferred over patching a west-managed
# tree that `west update` would silently revert.
CONFIG_COMPILER_OPT="-Dnrf_crypto_keys_housekeeping()="
