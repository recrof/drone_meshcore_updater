# -----------------------------------------------------------------------------
# drone_meshcore_updater — application Kconfig
# -----------------------------------------------------------------------------
# The device's role is:
#   1. Peripheral advertising an SMP transport so nRF Connect Device Manager
#      (Android/iOS) can upload firmware zips, browse files, and read logs.
#   2. Central that later connects to a nearby nRF52 running the Nordic
#      Legacy DFU bootloader and streams the uploaded zip to it.
# Both roles run in the same connection context — no role switching needed.

# -------------------- Bluetooth core --------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
# Board-neutral on purpose. This ran on one part for long enough that the name
# said which; it now runs on three, and was still advertising "XIAO nRF54
# updater" from an nRF52840 when that was noticed. Which board it is belongs on
# the wire as data, not in the advertised name.
#
# Lives in the scan response (sd[] in main.c), not the advertising packet, so
# its length is cheap — ad[] is full of the 128-bit SMP UUID.
CONFIG_BT_DEVICE_NAME="Drone MeshCore Updater"
# Three, not two: SMP client + DFU target + one slack slot.
#
# The slack slot matters. After a buttonless trigger the app-mode peer's
# link can outlive our attempt to close it: our write-with-response to the
# control point goes unanswered (the app is rebooting), and the pending ATT
# request keeps the connection alive until ATT's own 30 s timeout expires —
# bt_conn_disconnect() does not cut through it. Measured: trigger at
# t+0, explicit disconnect at t+7, link finally gone at t+30. With only two
# slots the SMP client holds one and that zombie holds the other, so every
# rescan in between fails bt_conn_le_create() with -ENOMEM and burns a
# retry (three consecutive attempts lost that way).
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=2
# 247 B ATT MTU matches what our existing nRF52 client negotiates so we can
# reuse the same stream chunk size for the DFU packet writes.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y

# ---- Thread stacks that must not depend on the SoC ----
#
# fsx_stream's on_data_write() calls fs_write() straight from the GATT write
# callback, i.e. **on the BT RX thread**, so that thread carries LittleFS and
# the flash driver on top of the host stack. NCS sizes it like this:
#
#   config BT_RX_STACK_SIZE
#       default 2048 if !BT_SMP && (SOC_SERIES_NRF54L || SOC_SERIES_NRF54H)
#       default 1024
#
# 2048 on the nRF54L, 1024 everywhere else — and this firmware only ever ran
# on an nRF54L, so the stack it actually needs arrived by accident of the part.
# On the nRF52840 the first real upload overflowed it: the link dropped exactly
# 4 s after the transfer started, which is the negotiated supervision timeout,
# and a supervision timeout means the *controller* stopped. A slow flash write
# cannot do that — link-layer acks come from the SoftDevice Controller in
# interrupt context and keep flowing however stalled the host threads are — so
# the CPU had faulted (HW_STACK_PROTECTION is on, so an overflow is fatal) and
# reset.
#
# Pinned here rather than in a board file: the value is a property of what this
# application does on that thread, not of the silicon. Same shape as
# MCUMGR_MGMT_NOTIFICATION_HOOKS above — a Kconfig default keyed on
# SOC_SERIES_NRF54L that quietly made a second board wrong.
CONFIG_BT_RX_STACK_SIZE=2048
#
# BT_LONG_WQ_STACK_SIZE differs between the two boards as well (2100 vs 1024)
# and is deliberately NOT set here: NCS declares it with no prompt, so a line
# in this file would be dropped without a word. Its 2100 comes from
# BT_GATT_CACHING, which is only on for the nRF54L — the long workqueue really
# is doing less on the nRF52840, so that difference is correct rather than
# accidental.

# ---- Throughput knobs ----
# Advertise fast connection-interval preferences in the peripheral params
# so the central picks 7.5-15 ms at connect time. No runtime param-update
# request (that path caused disconnects when we tried it as _CONN_PARAM_CONTROL).
# Units of 1.25 ms: 6 = 7.5 ms, 12 = 15 ms. Timeout in 10 ms units.
# Widened pref window — earlier 6..12 (7.5..15 ms) may have been outside
# what macOS's BT stack accepts and led to a *slower* fallback than the
# default. 12..24 (15..30 ms) is what most stacks honour without argument.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
#
# Data Length Extension + 2M PHY. These were blamed for a
# net_buf_alloc_len BUS FAULT during SDC init; that diagnosis was wrong
# (it was a truncated RRAM write — see the bisect-notes block below).
#
# DLE is the big one for DFU streaming. Without it the LL payload is
# 27 B, so every 251 B L2CAP PDU fragments into ~10 link-layer packets
# and takes about two connection events to get out — measured at 33.5 ms
# per 244 B packet on a 15 ms interval, i.e. ~7 KB/s. With DLE the whole
# ATT packet fits in a single LL PDU.
#
# AUTO_* makes the controller run the procedures itself right after
# connect, for both roles. A peer that doesn't support either simply
# negotiates back down to 27 B / 1M, so this is safe against old targets.
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y

# -------------------- TX power, per role and per connection -----------------
#
# **Without this, `tx_power` in config.txt did nothing on any board**, which is
# the opposite of what src/tx_power.c was written to believe. That file sends
# HCI VS opcode 0xFC0E and treated a refusal as "this controller does not
# implement it, so it must be the Espressif one". The nRF boards refused it
# too, every boot:
#
#   <wrn> bt_hci_core: opcode 0xfc0e status 0x01        (Unknown HCI Command)
#   <wrn> tx_power: adv: HCI VS write-tx-power refused (err -5)
#
# The SoftDevice Controller does implement it — but only when this symbol is
# on. `nrf/subsys/bluetooth/controller/hci_internal.c` wraps both the write and
# the read in `#if defined(CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL)`, and the
# default is n. Nothing in the build said so, because an unimplemented VS
# opcode is answered rather than rejected at compile time.
#
# It `depends on BT_HCI_VS` and nothing else, so it comes out `=y` on all three
# boards — checked in each .config, not assumed. That does **not** mean it works
# on all three: the symbol only gates NCS's dispatch of the opcode to the
# SoftDevice Controller. Espressif's controller is a binary blob with no such
# command, so the ESP32-S3 still refuses 0xFC0E, and tx_power.c's latch is still
# what keeps that from being a warning on every connection.
#
# The nRF52840's ladder tops out at +8 dBm, which is `tx_power`'s maximum and
# its default; the radio rounds silently, so the boot log reports the level the
# controller actually selected rather than the one asked for.
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# -------------------- MCUmgr / SMP over BLE --------------------
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# SMP messages > ATT-MTU-3 arrive as multiple BLE notifications; without
# this, mcumgr sees each fragment as its own truncated frame and returns
# MGMT_ERR_ECORRUPT ("Corrupt(9)") on the fs upload write handler.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
# NB: MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL was enabled here to
# request shorter connection intervals during SMP activity, but the
# parameter-update request seems to be causing some peers to drop the
# link ~4 s after connect (Chrome/Web-Bluetooth on macOS in particular).
# Left disabled — throughput on the default interval is fine for our
# file-manager use case; if we later need faster upload we can re-enable
# with tuned bounds.
# CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
# Advertise SMP in the scan response so nRF Connect DM picks it up
# automatically without the user pasting a UUID filter.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
# NB: MCUMGR_GRP_OS_TASKSTAT / INFO / BOOTLOADER_INFO / MCUMGR_PARAMS
# populate the "Device Status" panel in nRF Connect Device Manager. They
# were blamed for a boot-time BUS FAULT; that diagnosis was wrong (see the
# bisect-notes block below — it was a truncated RRAM write). Safe to
# re-enable; left off only because nothing needs them right now.
CONFIG_MCUMGR_GRP_IMG=y   # so the updater can update itself over BLE
# Board identity, and it is load-bearing rather than cosmetic. The client has
# to know which board it is talking to: MCUboot validates an update's signature
# and not its architecture, and both boards sign with the same key, so nothing
# else stops an nRF54L image being pushed into an nRF52840 over Bluetooth. It
# would verify, swap, and fail to boot.
#
# No custom protocol needed — the standard info command's hardware-platform
# field is the full board target ("xiao_ble/nrf52840"), which is exactly the
# string the build already knows itself by. nRF Connect Device Manager reads it
# too, for free.
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_FS=y    # upload / download / delete zips + config + log
# The hook itself, plus the framework it depends on. Setting only the first is
# not enough and does not say so: MCUMGR_GRP_FS_FILE_ACCESS_HOOK `depends on
# MCUMGR_MGMT_NOTIFICATION_HOOKS`, and Kconfig quietly drops an assignment
# whose dependencies are unmet.
#
# It looked like it worked because of an accident of the SoC. NCS defines
# MCUMGR_GRP_OS_REBOOT_BT as `default y ... depends on SOC_SERIES_NRF54L` and
# it selects the notification hooks — so on the nRF54L the framework arrived
# for free, and the moment this firmware was built for an nRF52840 the hook
# silently turned off. Only upload_hook.c's reference to
# mgmt_callback_register() turned that into a link error rather than a feature
# that was simply gone.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y  # we register a hook to auto-start DFU on upload
# SMP transport / reassembly buffers. NETBUF_SIZE only needs to hold the
# largest single SMP frame we ever RX or TX; our upload chunks stay ~<500
# B (400 B file data + CBOR keys + SMP header), so 1024 B is plenty and
# far cheaper on stack than the previous 2475 B (which was cargo-culted
# from an early experiment and correlated with a workqueue stack overflow
# during the fs download response path).
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
#
# **8192, not 4096, and this is not precautionary — 4096 was measured
# overflowing.** A XIAO nRF52840 rebooted mid-session; crash_record.c named the
# thread and the frame:
#
#   PREVIOUS RUN CRASHED: STACK OVERFLOW (reason 2) in thread mcumgr smp
#     pc=0x00074472 (memcpy) lr=0x00071eab (lfs_bd_read, lfs.c:84)
#
# i.e. this thread, inside a littlefs read, on a perfectly ordinary SMP file
# operation. Every fsx_mgmt and fs_mgmt handler runs here, and each of them
# ends up several hundred bytes deep in littlefs, which is the part nobody
# budgets for. Walking the direct-call graph of the linked image puts the
# deepest reachable path from smp_handle_reqs at ~2.8 KB (fsx_rmdir and
# fsx_inspect are the two worst, both through lfs_dir_fetchmatch), and that is
# a *floor*: littlefs dispatches through callbacks the disassembly cannot
# follow, so the real figure is higher — as the crash demonstrates.
#
# The comment above about NETBUF_SIZE already records an earlier overflow on
# this same thread, on the fs download path. That is twice. 8 KB against 38%
# RAM use is the cheap side of this trade.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=8192
CONFIG_MCUMGR_GRP_FS_PATH_LEN=128

# NB (2026-07-24 bisect notes — SUPERSEDED, root cause found):
#
# A long list of unrelated knobs (THREAD_NAME, THREAD_MONITOR,
# THREAD_STACK_INFO, BT_RX_STACK_SIZE, BT_HCI_TX_STACK_SIZE,
# MCUMGR_GRP_OS_TASKSTAT, BT_USER_PHY_UPDATE, BT_USER_DATA_LEN_UPDATE)
# each appeared to "cause" a BUS FAULT in net_buf_alloc_len during
# bt_enable() → SDC init. None of them did.
#
# The real cause was in the flashing path. Seeed's `nrf54lm20a-load`
# openocd proc enables RRAM writes and calls load_image, but never
# commits the RRAM controller's internal 128-bit write buffer. The final
# *partial* 16-byte line of the image is therefore never programmed and
# reads back as erased 0xFF.
#
# With the then-current 265676-byte image (12 B past a 16-byte boundary)
# the lost bytes covered `sync_evt_pool.__bufs`, so net_buf_alloc_len()
# computed buf = 0xFFFFFFFF and faulted storing buf->pool_id — BFAR 0x9,
# exactly one word past the end. Every Kconfig change merely moved the
# image size, changing *which* bytes fell off the end: sometimes padding
# (no symptom), sometimes a live pointer (instant fault). Hence the
# perfectly reproducible but completely spurious bisect results.
#
# Fixed in updater/boards/seeed/xiao_nrf54lm20a/support/openocd.cfg by
# triggering RRAMC TASKS_COMMITWRITEBUF + clearing CONFIG.WEN after
# load_image, and build.sh now passes --verify so a short write fails
# loudly at flash time instead of silently at boot.
#
# => All the knobs listed above are believed safe. Re-enable them
#    deliberately (PHY update + DLE are the valuable ones for
#    throughput), don't just assume they're cursed.
#
# The reassembly-netbuf shrink (2475 → 1024) stays — that one was a real
# fix for a genuine stack overflow on the BT-RX thread during fs
# download, independent of all of the above.

# -------------------- Legacy DFU client (C++ port) --------------------
# modules/nordic-legacy-dfu: the Nordic Legacy DFU protocol ported directly
# from the Android DFU Library. It is the only DFU client.
# Both are currently built; dfu_runner still calls the C one. See
# modules/nordic-legacy-dfu/README.md for the API and the list of places
# the two differ (PRN handling and upload flow control, mainly).
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NORDIC_LEGACY_DFU=y
CONFIG_NORDIC_LEGACY_DFU_LOG_LEVEL_INF=y
# 244 B payloads need an ATT MTU of 247, which this app already negotiates.
# A target that only does MTU 23 negotiates itself back down to 20 B.
CONFIG_NORDIC_LEGACY_DFU_MAX_PACKET_SIZE=244

# -------------------- Filesystem on external 8 MB PY25Q64 --------------------
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=n
CONFIG_FILE_SYSTEM_LITTLEFS=y
# LittleFS gives us wear leveling for free, matters because the drone use
# case will rewrite the same zip slot repeatedly.
CONFIG_FS_LITTLEFS_FMP_DEV=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
# nRF54L sQSPI + Nordic QSPI-NOR device driver.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# -------------------- Logging --------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# 4096 was too small once BT_CONN logging is at INF: a burst of link
# activity evicted whole runs of application messages (an entire DFU
# start-up sequence — runner begin / config / zip parse — vanished from a
# capture while messages either side of it survived). Dropped lines during
# diagnosis are expensive; 8192 is cheap.
CONFIG_LOG_BUFFER_SIZE=8192
# One-line-per-negotiation ground truth so we can see actual connection
# interval / PHY / MTU rather than guessing why throughput is low.
# Prints things like:
#   <inf> bt_conn: LE conn param req: int (0x0006, 0x000c) lat 0 to 400
#   <inf> bt_conn: LE conn param updated: int 0x0028 lat 0 to 400
# Downgrade to <wrn> later once we're done tuning.
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y
# Console over the SAMD11 bridge UART. Serial is the only tether we have on
# this board — no native USB.
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y

# **The 1200-baud touch needs this, and its absence is completely silent.**
# src/usb_dfu_touch.c (nRF52840 only) asks the CDC ACM instance what line
# coding the host just set, with `uart_line_ctrl_get()`. That call is only
# *routed* when CONFIG_UART_LINE_CTRL is on: `usbd_cdc_acm.c` wraps
# `.line_ctrl_get` in `#ifdef CONFIG_UART_LINE_CTRL`, so without it the driver
# publishes USBD_MSG_CDC_ACM_LINE_CODING, our callback runs, the query returns
# -ENOSYS, and the callback returns having done nothing. Everything looks
# wired: the message arrives, the handler is registered, no error is logged
# anywhere. The board simply never reboots.
#
# Set here rather than in a board fragment because the *feature* is already
# board-gated in CMakeLists.txt, and a `boards/xiao_ble.conf` would need a
# `_sense` twin that nothing checks (see the ESP32-S3 fragment for how that
# goes wrong). usb_dfu_touch.c carries a BUILD_ASSERT so this cannot be
# quietly dropped again.
CONFIG_UART_LINE_CTRL=y
# Persist log lines to LOG.TXT on the LittleFS partition so the nRF Connect
# DM app can `fs download` them without needing a UART cable.
# Live log streaming over BLE (src/log_stream.c). Its own backend, not
# CONFIG_LOG_BACKEND_BLE — that one latches whichever connection came last,
# which on this device is the DFU target. See the header comment there.
CONFIG_RING_BUFFER=y

CONFIG_LOG_BACKEND_FS=y
# _FILE_PREFIX is a FILE NAME prefix, not a path — log_backend_fs.c builds
# "<DIR>/<PREFIX><NNNN>". This was "/lfs1/LOG", which produced
# "/lfs1//lfs1/LOG0000": a path under a directory that does not exist, so
# fs_open() returned -ENOENT and no log file was ever created. That is the
# "<err> fs: file open error (-2)" at boot, which was filed as harmless and
# was not — it was the whole logging-to-flash feature failing silently.
CONFIG_LOG_BACKEND_FS_DIR="/lfs1"
CONFIG_LOG_BACKEND_FS_FILE_PREFIX="LOG."
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=3
CONFIG_LOG_BACKEND_FS_FILE_SIZE=32768

# -------------------- MCUboot (bootloader-side settings) --------------------
# The build produces `app_update.bin` for OTA of this updater itself.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# -------------------- Fatal errors must reboot, not halt --------------------
#
# Zephyr's default k_sys_fatal_error_handler calls arch_system_halt(): the CPU
# stops, forever. Observed on the ESP32-S3 as "the board shuts down" — LEDs
# stop, it disappears from Bluetooth, and it never comes back.
#
# **A halt also silently disables the entire wireless safety net.**
# src/selfconfirm.c works by leaving a freshly-uploaded image *unconfirmed*, so
# that MCUboot restores the previous one **at the next reset**. An image that
# faults and halts never reaches a next reset, so the revert never happens.
# The one failure the safety net exists for — a bad OTA to a device nobody can
# reach — is precisely the one where halting makes it permanent.
#
# **The reboot is ours now, not NCS's, and the dump never reached flash.**
# This used to be CONFIG_RESET_ON_FATAL_ERROR=y (an NCS symbol,
# nrf/lib/fatal_error) on the strength of a claim that was simply wrong: that
# its LOG_PANIC() "flushes the log synchronously, so the fault dump reaches
# /lfs1/LOG.NNNN". log_panic() calls each backend's panic() *before* it
# flushes, and the filesystem backend's panic() deactivates the backend — so
# the flush reaches the console only, and takes the whole deferred queue with
# it. On the nRF52840 that console is USB CDC, which the reset unplugs. A fault
# there left no trace anywhere: no dump, no last words, just a log file that
# stops mid-sentence and a board that is up again. src/crash_record.c has the
# citations.
#
# So the handler lives in src/crash_record.c instead. It stores the reason,
# thread, PC/LR and stack margin in a __noinit struct — no locks, no flash, safe
# on a stack that just overflowed — and then does exactly what NCS's did:
# LOG_PANIC() and reboot. main() logs the record on the way back up, on a
# healthy system, into the file. Two strong k_sys_fatal_error_handler symbols
# cannot coexist, which is why the NCS one is off rather than merely unused.
CONFIG_RESET_ON_FATAL_ERROR=n

# **A software stack guard, because the ESP32-S3 has no hardware one.**
# `HW_STACK_PROTECTION` depends on `ARCH_HAS_STACK_PROTECTION`, and Xtensa is
# not among the architectures that select it — grep `select
# ARCH_HAS_STACK_PROTECTION` and you get arm, arm64, arc, riscv, x86 and
# nothing else. So on that board a stack overflow is not a fault at all: it
# writes over whatever is below and the machine keeps going until something
# unrelated trips, which is how a 512-byte LED thread crashed as a bare CPU
# exception with its own stack apparently still half free.
#
# STACK_SENTINEL puts a magic word at the bottom of every stack and checks it
# at each context switch, ISR exit and k_yield(). It catches the overflow after
# the fact rather than at the instruction, but it names the thread — and a
# named thread is the difference between a fix and a week.
#
# What it does on each board, which is not the same thing and is worth knowing:
#   xiao_esp32s3   on, and the only guard there is
#   xiao_ble       **dropped** — it `depends on !MPU_STACK_GUARD`, and the
#                  nRF52840 has that, which is strictly better
#   xiao_nrf54lm20a on, alongside BUILTIN_STACK_GUARD's PSPLIM. Redundant, and
#                  left that way rather than split across board fragments: one
#                  compare per context switch is not worth a second file that
#                  nothing checks (see the ESP32-S3 fragment's own warning
#                  about exactly that).
CONFIG_STACK_SENTINEL=y

# Names threads, so a crash record says "dfu_runner" instead of a pointer, and
# so Zephyr's own "Current thread:" line is readable on a console. Costs
# CONFIG_THREAD_MAX_NAME_LEN bytes per thread; the whole point of the record is
# that it is legible without a debugger attached.
CONFIG_THREAD_NAME=y

# Bounds how much history a crash can take with it. The deferred log thread
# drains on a timer unless LOG_PROCESS_TRIGGER_THRESHOLD messages pile up
# first, and everything still queued when a fault lands is lost — see above. At
# the 1000 ms default that is a second of context, which is most of what a
# fault is *about*. This project's steady-state log volume is a handful of
# lines per minute, so draining ten times as often costs nothing measurable.
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100

# **The logging thread runs littlefs, and 2048 was measured overflowing.**
# Caught by CONFIG_STACK_SENTINEL on its first boot after being enabled:
#
#   >>> ZEPHYR FATAL ERROR 2: Stack overflow on CPU 0
#   Current thread: 0x3fcbd290 (logging)
#
# at 0.750 s — which is when LOG_BACKEND_FS creates or rotates its log file.
# That is easy to forget about this backend: `log_process()` calls it inline,
# so every `LOG_*` in the firmware is ultimately a filesystem write on *this*
# thread's stack, and littlefs is deep. Walking the direct-call graph of the
# linked images:
#
#   allocate_new_file   2352 B (Xtensa)   3328 B (ARM)
#   fs_unlink           2320 B            2744 B   <- rotation deletes the oldest
#   fs_sync             2176 B              352 B
#   fs_write            1728 B             2096 B
#
# — before the ~150 B of logging frames above them, and before the exception
# frame Xtensa pushes onto whichever thread was running. Those figures are
# floors (indirect calls are invisible to a call graph), which is the direction
# that matters here.
#
# 4096 is double what was observed failing. The nRF parts have run on 2048
# without their MPU guard firing, so the deepest paths are evidently rare — but
# "rare" is a log rotation, and the one board where it is not caught is the one
# with no guard at all.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096

# CONFIG_HWINFO was already on under Misc below; main() now uses it to report
# *why* we rebooted, once, at boot. That turns "it restarted" into "brownout" /
# "watchdog" / "panic" with no serial cable — which on the ESP32-S3 is not
# available anyway, its console being the USB connector the reset drops. See
# Trap 6 in notes/traps.md.

# -------------------- Misc --------------------
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_SETTINGS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
