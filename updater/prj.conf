# -----------------------------------------------------------------------------
# xiao_nrf54_updater — application Kconfig
# -----------------------------------------------------------------------------
# The device's role is:
#   1. Peripheral advertising an SMP transport so nRF Connect Device Manager
#      (Android/iOS) can upload firmware zips, browse files, and read logs.
#   2. Central that later connects to a nearby nRF52 running the Nordic
#      Legacy DFU bootloader and streams the uploaded zip to it.
# Both roles run in the same connection context — no role switching needed.

# -------------------- Bluetooth core --------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="XIAO nRF54 updater"
# Three, not two: SMP client + DFU target + one slack slot.
#
# The slack slot matters. After a buttonless trigger the app-mode peer's
# link can outlive our attempt to close it: our write-with-response to the
# control point goes unanswered (the app is rebooting), and the pending ATT
# request keeps the connection alive until ATT's own 30 s timeout expires —
# bt_conn_disconnect() does not cut through it. Measured: trigger at
# t+0, explicit disconnect at t+7, link finally gone at t+30. With only two
# slots the SMP client holds one and that zombie holds the other, so every
# rescan in between fails bt_conn_le_create() with -ENOMEM and burns a
# retry (three consecutive attempts lost that way).
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=2
# 247 B ATT MTU matches what our existing nRF52 client negotiates so we can
# reuse the same stream chunk size when we port dfu_legacy.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y

# ---- Throughput knobs ----
# Advertise fast connection-interval preferences in the peripheral params
# so the central picks 7.5-15 ms at connect time. No runtime param-update
# request (that path caused disconnects when we tried it as _CONN_PARAM_CONTROL).
# Units of 1.25 ms: 6 = 7.5 ms, 12 = 15 ms. Timeout in 10 ms units.
# Widened pref window — earlier 6..12 (7.5..15 ms) may have been outside
# what macOS's BT stack accepts and led to a *slower* fallback than the
# default. 12..24 (15..30 ms) is what most stacks honour without argument.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
#
# Data Length Extension + 2M PHY. These were blamed for a
# net_buf_alloc_len BUS FAULT during SDC init; that diagnosis was wrong
# (it was a truncated RRAM write — see the bisect-notes block below).
#
# DLE is the big one for DFU streaming. Without it the LL payload is
# 27 B, so every 251 B L2CAP PDU fragments into ~10 link-layer packets
# and takes about two connection events to get out — measured at 33.5 ms
# per 244 B packet on a 15 ms interval, i.e. ~7 KB/s. With DLE the whole
# ATT packet fits in a single LL PDU.
#
# AUTO_* makes the controller run the procedures itself right after
# connect, for both roles. A peer that doesn't support either simply
# negotiates back down to 27 B / 1M, so this is safe against old targets.
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y

# -------------------- MCUmgr / SMP over BLE --------------------
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# SMP messages > ATT-MTU-3 arrive as multiple BLE notifications; without
# this, mcumgr sees each fragment as its own truncated frame and returns
# MGMT_ERR_ECORRUPT ("Corrupt(9)") on the fs upload write handler.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
# NB: MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL was enabled here to
# request shorter connection intervals during SMP activity, but the
# parameter-update request seems to be causing some peers to drop the
# link ~4 s after connect (Chrome/Web-Bluetooth on macOS in particular).
# Left disabled — throughput on the default interval is fine for our
# file-manager use case; if we later need faster upload we can re-enable
# with tuned bounds.
# CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
# Advertise SMP in the scan response so nRF Connect DM picks it up
# automatically without the user pasting a UUID filter.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
# NB: MCUMGR_GRP_OS_TASKSTAT / INFO / BOOTLOADER_INFO / MCUMGR_PARAMS
# populate the "Device Status" panel in nRF Connect Device Manager. They
# were blamed for a boot-time BUS FAULT; that diagnosis was wrong (see the
# bisect-notes block below — it was a truncated RRAM write). Safe to
# re-enable; left off only because nothing needs them right now.
CONFIG_MCUMGR_GRP_IMG=y   # so the updater can update itself over BLE
CONFIG_MCUMGR_GRP_FS=y    # upload / download / delete zips + config + log
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y  # we register a hook to auto-start DFU on upload
# SMP transport / reassembly buffers. NETBUF_SIZE only needs to hold the
# largest single SMP frame we ever RX or TX; our upload chunks stay ~<500
# B (400 B file data + CBOR keys + SMP header), so 1024 B is plenty and
# far cheaper on stack than the previous 2475 B (which was cargo-culted
# from an early experiment and correlated with a workqueue stack overflow
# during the fs download response path).
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_MCUMGR_GRP_FS_PATH_LEN=128

# NB (2026-07-24 bisect notes — SUPERSEDED, root cause found):
#
# A long list of unrelated knobs (THREAD_NAME, THREAD_MONITOR,
# THREAD_STACK_INFO, BT_RX_STACK_SIZE, BT_HCI_TX_STACK_SIZE,
# MCUMGR_GRP_OS_TASKSTAT, BT_USER_PHY_UPDATE, BT_USER_DATA_LEN_UPDATE)
# each appeared to "cause" a BUS FAULT in net_buf_alloc_len during
# bt_enable() → SDC init. None of them did.
#
# The real cause was in the flashing path. Seeed's `nrf54lm20a-load`
# openocd proc enables RRAM writes and calls load_image, but never
# commits the RRAM controller's internal 128-bit write buffer. The final
# *partial* 16-byte line of the image is therefore never programmed and
# reads back as erased 0xFF.
#
# With the then-current 265676-byte image (12 B past a 16-byte boundary)
# the lost bytes covered `sync_evt_pool.__bufs`, so net_buf_alloc_len()
# computed buf = 0xFFFFFFFF and faulted storing buf->pool_id — BFAR 0x9,
# exactly one word past the end. Every Kconfig change merely moved the
# image size, changing *which* bytes fell off the end: sometimes padding
# (no symptom), sometimes a live pointer (instant fault). Hence the
# perfectly reproducible but completely spurious bisect results.
#
# Fixed in updater/boards/seeed/xiao_nrf54lm20a/support/openocd.cfg by
# triggering RRAMC TASKS_COMMITWRITEBUF + clearing CONFIG.WEN after
# load_image, and build.sh now passes --verify so a short write fails
# loudly at flash time instead of silently at boot.
#
# => All the knobs listed above are believed safe. Re-enable them
#    deliberately (PHY update + DLE are the valuable ones for
#    throughput), don't just assume they're cursed.
#
# The reassembly-netbuf shrink (2475 → 1024) stays — that one was a real
# fix for a genuine stack overflow on the BT-RX thread during fs
# download, independent of all of the above.

# -------------------- Filesystem on external 8 MB PY25Q64 --------------------
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=n
CONFIG_FILE_SYSTEM_LITTLEFS=y
# LittleFS gives us wear leveling for free, matters because the drone use
# case will rewrite the same zip slot repeatedly.
CONFIG_FS_LITTLEFS_FMP_DEV=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
# nRF54L sQSPI + Nordic QSPI-NOR device driver.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y

# -------------------- Logging --------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# 4096 was too small once BT_CONN logging is at INF: a burst of link
# activity evicted whole runs of application messages (an entire DFU
# start-up sequence — runner begin / config / zip parse — vanished from a
# capture while messages either side of it survived). Dropped lines during
# diagnosis are expensive; 8192 is cheap.
CONFIG_LOG_BUFFER_SIZE=8192
# One-line-per-negotiation ground truth so we can see actual connection
# interval / PHY / MTU rather than guessing why throughput is low.
# Prints things like:
#   <inf> bt_conn: LE conn param req: int (0x0006, 0x000c) lat 0 to 400
#   <inf> bt_conn: LE conn param updated: int 0x0028 lat 0 to 400
# Downgrade to <wrn> later once we're done tuning.
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y
# Console over the SAMD11 bridge UART. Serial is the only tether we have on
# this board — no native USB.
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
# Persist log lines to LOG.TXT on the LittleFS partition so the nRF Connect
# DM app can `fs download` them without needing a UART cable.
CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_FILE_PREFIX="/lfs1/LOG"
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=3
CONFIG_LOG_BACKEND_FS_FILE_SIZE=32768

# -------------------- MCUboot (bootloader-side settings) --------------------
# The build produces `app_update.bin` for OTA of this updater itself.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# -------------------- Misc --------------------
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_SETTINGS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
